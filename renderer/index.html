<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aaroneal Stream Dashboard</title>

<link rel="stylesheet" href="vendor/gridstack.min.css">

<style>
  @font-face {
    font-family: 'Geist';
    src: url('vendor/geist-var.woff2') format('woff2-variations');
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg:           #0a0a0d;
    --surface:      #0e0e12;
    --panel:        #111116;
    --panel-2:      #16161c;
    --panel-hover:  #1c1c23;
    --border:       #26262f;
    --border-sub:   #1c1c23;
    --text:         #f2f2f6;
    --text-dim:     #9d9dac;
    --text-muted:   #585866;
    --accent:       #e9e9f0;
    --accent-dim:   rgba(233, 233, 240, 0.08);
    --accent-glow:  rgba(233, 233, 240, 0.22);
    --danger:       #f4566a;
    --danger-dim:   rgba(244, 86, 106, 0.12);
    --header-h:     22px;
    --gap:          0px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Geist', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
    font-size: 12px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Stats bar sits above the grid; the grid takes whatever height remains */
  body {
    display: flex;
    flex-direction: column;
  }

  /* ===== STATS BAR ===== */
  #stats-bar {
    flex: 0 0 auto;
    position: relative;
    display: flex;
    align-items: stretch;
    justify-content: center;
    background: var(--surface);
    border-bottom: 1px solid var(--border-sub);
    height: 44px;
    overflow: hidden;
    user-select: none;
  }
  #stats-bar.hidden { display: none; }

  #stats-items {
    display: flex;
    align-items: stretch;
    justify-content: safe center;
    max-width: 100%;
    margin: 0 48px; /* stay clear of the action buttons */
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
  }
  #stats-items::-webkit-scrollbar { display: none; }

  .stat {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 1px;
    padding: 0 18px;
    margin: 5px 1px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.12s ease, opacity 0.12s ease, transform 0.1s ease;
  }
  .stat:hover  { background: rgba(255, 255, 255, 0.05); }
  .stat:active { transform: scale(0.96); }
  .stat.dragging { opacity: 0.35; }
  .stat.masked .stat-value { color: var(--text-muted); letter-spacing: 2px; }
  .stat.masked .stat-label { color: var(--text-muted); }

  .stat-value {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
    line-height: 1.25;
  }
  .stat-label {
    font-size: 9px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-muted);
    line-height: 1.2;
  }

  #stats-placeholder {
    display: flex;
    align-items: center;
    padding: 0 16px;
    color: var(--text-muted);
    font-size: 11px;
  }

  .stats-actions {
    position: absolute;
    right: 6px;
    top: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .stats-actions button {
    background: transparent;
    border: 0;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 12px;
    padding: 4px 7px;
    border-radius: 4px;
    font-family: inherit;
    line-height: 1;
    transition: color 0.1s ease, background 0.1s ease;
  }
  .stats-actions button:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.07);
  }

  #stats-menu {
    position: fixed;
    top: 48px;
    right: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 0;
    min-width: 190px;
    z-index: 9998;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03);
  }
  #stats-menu.hidden { display: none; }
  #stats-menu .stats-menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-dim);
  }
  #stats-menu .stats-menu-item:hover { background: var(--panel-hover); color: var(--text); }
  #stats-menu .stats-menu-item input { accent-color: var(--accent); cursor: pointer; }

  /* ===== GRID ===== */
  .grid-wrapper {
    flex: 1 1 0;
    min-height: 0;
    width: 100vw;
    overflow: hidden;
    background: var(--bg);
    position: relative;
  }

  .grid-stack {
    background: var(--bg);
    width: 100%;
    min-height: 100%;
  }

  .grid-stack-item-content {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transition: border-color 0.2s ease, border-radius 0.2s ease;
  }

  /* Locked: borderless edge-to-edge tiles, headers collapsed until hovered.
     border-width goes to 0 (not just transparent) so panel content sits
     perfectly flush against its neighbours with zero wasted pixels. */
  body.locked .grid-stack-item-content {
    border-width: 0;
    border-color: transparent;
    border-radius: 0;
  }
  body.locked .panel-header {
    height: 0;
    opacity: 0;
    overflow: hidden;
    border-bottom: 0;
    pointer-events: none;
  }
  /* Hover reveal — driven by cursor tracking in main.js (mouse events over
     BrowserViews never reach this document). The panel body shrinks while the
     header slides in; BV bounds are re-synced every frame of the transition. */
  body.locked .grid-stack-item.reveal-header .panel-header {
    height: var(--header-h);
    opacity: 1;
    border-bottom: 1px solid var(--border-sub);
  }
  /* Only an intentionally-revealed (armed) header accepts clicks, so a cursor
     brushing the top edge can never immediately hit Close. */
  body.locked .grid-stack-item.reveal-header.armed .panel-header { pointer-events: auto; }
  body.locked .panel-header .actions { opacity: 1; }

  .grid-stack-item-content,
  .grid-stack-item-content > * {
    min-height: 0;
    min-width: 0;
  }

  .grid-stack-item:hover > .grid-stack-item-content {
    border-color: #34343f;
  }

  /* ===== RESIZE HANDLES ===== */
  .grid-stack-item > .ui-resizable-handle {
    background-image: none !important;
    background: transparent !important;
  }
  .grid-stack-item > .ui-resizable-se,
  .grid-stack-item > .ui-resizable-sw,
  .grid-stack-item > .ui-resizable-ne,
  .grid-stack-item > .ui-resizable-nw {
    background-image: none !important;
    color: transparent !important;
    font-size: 0 !important;
  }
  .grid-stack-item > .ui-resizable-se::after,
  .grid-stack-item > .ui-resizable-sw::after,
  .grid-stack-item > .ui-resizable-ne::after,
  .grid-stack-item > .ui-resizable-nw::after { display: none !important; }

  .grid-stack-item > .ui-resizable-e,
  .grid-stack-item > .ui-resizable-w { width: 8px; }
  .grid-stack-item > .ui-resizable-n,
  .grid-stack-item > .ui-resizable-s { height: 8px; }

  .grid-stack-item > .ui-resizable-se,
  .grid-stack-item > .ui-resizable-sw,
  .grid-stack-item > .ui-resizable-ne,
  .grid-stack-item > .ui-resizable-nw { width: 14px; height: 14px; z-index: 10; }

  .grid-stack-item > .ui-resizable-n  { cursor: n-resize; }
  .grid-stack-item > .ui-resizable-s  { cursor: s-resize; }
  .grid-stack-item > .ui-resizable-e  { cursor: e-resize; }
  .grid-stack-item > .ui-resizable-w  { cursor: w-resize; }
  .grid-stack-item > .ui-resizable-ne { cursor: ne-resize; }
  .grid-stack-item > .ui-resizable-nw { cursor: nw-resize; }
  .grid-stack-item > .ui-resizable-se { cursor: se-resize; bottom: 0; right: 0; transition: background 0.15s ease; }
  .grid-stack-item > .ui-resizable-sw { cursor: sw-resize; }

  .grid-stack-item:hover > .ui-resizable-se {
    background: linear-gradient(135deg, transparent 50%, rgba(123, 140, 255, 0.3) 50%);
  }
  .grid-stack-item:hover > .ui-resizable-e {
    background: linear-gradient(to right, transparent 40%, rgba(123, 140, 255, 0.1));
  }
  .grid-stack-item:hover > .ui-resizable-s {
    background: linear-gradient(to bottom, transparent 40%, rgba(123, 140, 255, 0.1));
  }
  body.locked .grid-stack-item > .ui-resizable-handle { display: none !important; }

  /* ===== PANEL HEADER ===== */
  .panel-header {
    height: var(--header-h);
    background: var(--panel-2);
    border-bottom: 1px solid var(--border-sub);
    display: flex;
    align-items: center;
    padding: 0 6px 0 0;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-dim);
    flex-shrink: 0;
    cursor: move;
    user-select: none;
    transition: background 0.1s ease, color 0.1s ease,
                height 0.18s ease, opacity 0.14s ease;
  }

  body:not(.locked) .panel-header:hover {
    background: var(--panel-hover);
    color: var(--text);
  }

  body.locked .panel-header { cursor: default; }

  /* Colored dot — identifies panel type at a glance */
  .panel-header .type-stripe {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
    margin: 0 8px 0 9px;
    background: var(--accent);
    opacity: 0.9;
    transition: opacity 0.1s ease, background 0.15s ease;
  }

  .panel-header .title-group {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow: hidden;
    flex: 1;
  }

  .panel-header .title-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Actions are hidden until header hover — keeps the header a clean drag zone */
  .panel-header .actions {
    display: flex;
    gap: 1px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.12s ease;
  }

  .panel-header:hover .actions { opacity: 1; }

  .panel-header button {
    background: transparent;
    border: 0;
    color: var(--text-muted);
    cursor: pointer;
    padding: 3px 7px;
    font-size: 12px;
    border-radius: 3px;
    transition: color 0.1s ease, background 0.1s ease;
    font-family: inherit;
    line-height: 1;
    min-width: 24px;
    text-align: center;
  }

  .panel-header button:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.07);
  }
  .panel-header button:active { transform: scale(0.92); }

  .panel-header button.close-btn:hover {
    color: var(--danger);
    background: var(--danger-dim);
  }

  /* Panel type stripe colors */
  .panel-type-chat            .type-stripe { background: #9b6cff; }
  .panel-type-activity-feed   .type-stripe { background: #3ecf6e; }
  .panel-type-stream          .type-stripe { background: #ff5264; }
  .panel-type-quick-actions   .type-stripe { background: #7b8cff; }
  .panel-type-tikfinity-chat  .type-stripe { background: #ff7eb3; }
  .panel-type-tikfinity-views .type-stripe { background: #ff7eb3; }
  .panel-type-predictions     .type-stripe { background: #fbbf24; }
  .panel-type-sub-goal        .type-stripe { background: #3ecf6e; }
  .panel-type-stream-manager  .type-stripe { background: #7b8cff; }

  /* Locked state — stripe turns amber across all panels */
  body.locked .panel-header .type-stripe {
    background: #f0a000 !important;
    opacity: 1;
  }

  /* ===== PANEL BODY ===== */
  .panel-body {
    flex: 1 1 0;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .panel-body iframe {
    flex: 1 1 0;
    min-height: 0;
    width: 100%;
    border: 0;
    display: block;
  }

  /* ===== DRAG BEHAVIOR ===== */
  body.dragging iframe { pointer-events: none !important; }
  body.dragging * { user-select: none !important; }

  .grid-stack-item.ui-draggable-dragging,
  .grid-stack-item.ui-resizable-resizing {
    opacity: 0.85;
    z-index: 1000;
  }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    backdrop-filter: blur(8px) saturate(1.1);
  }

  .modal-overlay.show { display: flex; }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.97) translateY(-8px); }
    to   { opacity: 1; transform: scale(1)    translateY(0); }
  }
  .modal-overlay.show .modal { animation: modalIn 0.15s ease; }

  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 480px;
    max-width: 90vw;
    max-height: 85vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255,255,255,0.04);
  }

  .modal-header {
    padding: 14px 16px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-close-btn {
    background: transparent;
    border: 0;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 4px;
    line-height: 1;
    font-family: inherit;
    transition: color 0.1s ease, background 0.1s ease;
  }
  .modal-close-btn:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.07);
  }

  .modal-body {
    padding: 16px;
    overflow-y: auto;
    flex: 1;
  }

  .modal-body label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-muted);
    margin-bottom: 6px;
    margin-top: 18px;
    font-weight: 600;
  }
  .modal-body label:first-of-type { margin-top: 0; }

  .modal-body input[type="text"],
  .modal-body input[type="number"],
  .modal-body select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 5px;
    font-family: inherit;
    font-size: 12px;
    transition: border-color 0.1s ease, box-shadow 0.1s ease;
  }

  .modal-body input:focus,
  .modal-body select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  .modal-body input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  .range-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .range-row input[type="range"] { flex: 1; }
  .range-row .range-value {
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    min-width: 40px;
    text-align: right;
    font-size: 12px;
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    cursor: pointer;
  }
  .checkbox-row input[type="checkbox"] {
    accent-color: var(--accent);
    cursor: pointer;
    width: 14px;
    height: 14px;
  }
  .checkbox-row label {
    margin: 0;
    cursor: pointer;
    text-transform: none;
    letter-spacing: 0;
    color: var(--text);
    font-size: 12px;
  }

  /* ===== PRESET CARDS ===== */
  .preset-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 8px;
  }

  .preset-card {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 12px 8px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
    text-align: center;
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .preset-card:hover {
    border-color: var(--accent);
    background: var(--accent-dim);
    color: var(--text);
    transform: translateY(-1px);
  }
  .preset-card:active { transform: translateY(0) scale(0.98); }
  .preset-card .preset-icon { font-size: 20px; line-height: 1; }
  .preset-card .preset-name { font-size: 11px; font-weight: 600; color: var(--text); }
  .preset-card .preset-desc { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; }

  /* ===== MODAL FOOTER ===== */
  .modal-footer {
    padding: 12px 16px;
    background: var(--panel-2);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 6px;
  }

  .modal-footer button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 7px 16px;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    transition: color 0.1s ease, border-color 0.1s ease, background 0.1s ease;
  }
  .modal-footer button:hover {
    color: var(--text);
    border-color: #3a3a4a;
    background: rgba(255, 255, 255, 0.04);
  }
  .modal-footer button:active { transform: scale(0.97); }
  .modal-footer button.primary {
    background: var(--accent);
    color: #0c0c0f;
    border-color: var(--accent);
    font-weight: 600;
  }
  .modal-footer button.primary:hover { opacity: 0.88; }

  /* ===== MODAL SECTIONS ===== */
  .modal-body hr {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 20px 0 4px;
  }

  .modal-body .section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    font-weight: 700;
    margin-top: 8px;
    margin-bottom: 12px;
  }

  /* ===== SETTINGS RESET BUTTON ===== */
  .preset-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 11px;
    font-family: inherit;
    text-align: center;
    width: 100%;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .preset-btn:hover { border-color: var(--accent); color: var(--text); }

  /* ===== FOCUS RINGS ===== */
  button:focus-visible,
  input:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.14);
    border-radius: 10px;
    border: 3px solid transparent;
    background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.28);
    border: 3px solid transparent;
    background-clip: content-box;
  }

  /* ===== 7TV STATUS ===== */
  .status-line {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 14px;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
  }
  .status-dot.ok   { background: #3ecf6e; box-shadow: 0 0 0 3px rgba(62, 207, 110, 0.15); }
  .status-dot.warn { background: #fbbf24; box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.15); }
  .status-dot.bad  { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-dim); }

  .status-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 14px;
    font-size: 11px;
    margin-bottom: 4px;
  }
  .status-grid dt { color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-size: 9px; align-self: center; }
  .status-grid dd { color: var(--text-dim); word-break: break-all; font-variant-numeric: tabular-nums; }
  .status-grid dd.mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 10px; }

  .status-note {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--border-sub);
    font-size: 11px;
    line-height: 1.55;
    color: var(--text-dim);
  }
  .status-note strong { color: var(--text); }

  /* ===== FREEZE FRAMES ===== */
  /* Screenshot stand-ins shown while BrowserViews are hidden under menus/modals */
  .panel-body img.bv-freeze {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
    pointer-events: none;
  }

  /* ===== UPDATE TOAST ===== */
  #update-toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    min-width: 240px;
    max-width: 320px;
    z-index: 9999;
    font-size: 12px;
    color: var(--text);
    box-shadow: 0 6px 28px rgba(0,0,0,0.55);
    display: flex;
    flex-direction: column;
    gap: 10px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.18s ease, transform 0.18s ease;
    pointer-events: none;
  }
  #update-toast.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  #update-toast.state-ready  { border-color: var(--accent); }
  #update-toast.state-error  { border-color: var(--danger); }
  .toast-row {
    display: flex; align-items: flex-start;
    justify-content: space-between; gap: 10px;
  }
  .toast-msg { flex: 1; line-height: 1.5; color: var(--text-dim); }
  .toast-msg strong { color: var(--text); display: block; margin-bottom: 2px; }
  .toast-close {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 15px; padding: 0; line-height: 1; flex-shrink: 0;
  }
  .toast-close:hover { color: var(--text); }
  .toast-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .toast-actions button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    transition: color 0.1s ease, border-color 0.1s ease, background 0.1s ease;
  }
  .toast-actions button:hover {
    color: var(--text);
    border-color: #3a3a4a;
    background: rgba(255, 255, 255, 0.05);
  }
  .toast-actions button.primary {
    background: var(--accent);
    color: #0c0c0f;
    border-color: var(--accent);
    font-weight: 600;
  }
  .toast-actions button.primary:hover { opacity: 0.88; }
  .update-progress {
    width: 100%; height: 4px;
    background: var(--border); border-radius: 2px; overflow: hidden;
  }
  .update-progress-fill {
    height: 100%; background: var(--accent); transition: width 0.3s ease;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
</style>
</head>
