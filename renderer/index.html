<script>
  // ============ CONFIG ============
  // Nothing user-specific is hardcoded — channel and integration IDs live in
  // localStorage ('dashboard-config'), collected by the Channel Setup modal on
  // first run and editable via File → Channel Setup.
  const DEFAULT_CONFIG = {
    channel: '',          // Twitch channel name
    quickActionsUuid: '', // optional ?uuid= on the quick-actions popout
    seActivityUrl: '',    // StreamElements activity feed popout URL
    seOverlayUrl: '',     // StreamElements sub-goal overlay URL
    tikfinityCid: '',     // TikFinity channel id
  };
  let appConfig = { ...DEFAULT_CONFIG };

  function loadConfig() {
    const saved = localStorage.getItem('dashboard-config');
    if (saved) {
      try { appConfig = { ...DEFAULT_CONFIG, ...JSON.parse(saved) }; return; } catch {}
    }
    migrateConfigFromLayout(); // upgrade path for installs that predate config
  }

  function saveConfig() {
    localStorage.setItem('dashboard-config', JSON.stringify(appConfig));
  }

  // Pre-config installs have the user's URLs baked into the saved layout —
  // recover channel/IDs from them so the setup modal never bothers existing users.
  function migrateConfigFromLayout() {
    const sources = [];
    try { sources.push(...(JSON.parse(localStorage.getItem('dashboard-layout') || '[]'))); } catch {}
    try {
      for (const l of JSON.parse(localStorage.getItem('dashboard-saved-layouts') || '[]')) {
        sources.push(...(l.panels || []));
      }
    } catch {}
    try { sources.push(...(JSON.parse(localStorage.getItem('dashboard-closed') || '[]')).map(c => ({ config: c }))); } catch {}

    for (const n of sources) {
      const url = (n && n.config && n.config.url) || '';
      let m;
      if (!appConfig.channel) {
        if ((m = url.match(/twitch\.tv\/popout\/([^/]+)\/chat/)))            appConfig.channel = m[1];
        else if ((m = url.match(/dashboard\.twitch\.tv\/(?:popout\/)?u\/([^/]+)/))) appConfig.channel = m[1];
        else if ((m = url.match(/player\.twitch\.tv\/\?channel=([^&]+)/)))   appConfig.channel = m[1];
      }
      if (!appConfig.quickActionsUuid && (m = url.match(/quick-actions\?uuid=([a-f0-9-]+)/)))
        appConfig.quickActionsUuid = m[1];
      if (!appConfig.seActivityUrl && /streamelements\.com\/dashboard\/.+\/activity/.test(url))
        appConfig.seActivityUrl = url;
      if (!appConfig.seOverlayUrl && /streamelements\.com\/overlay\//.test(url))
        appConfig.seOverlayUrl = url;
      if (!appConfig.tikfinityCid && (m = url.match(/tikfinity\.zerody\.one\/widget\/[^?]*\?cid=(\d+)/)))
        appConfig.tikfinityCid = m[1];
    }
    if (appConfig.channel) saveConfig();
  }

  // Presets are derived from config. A preset with an empty url is "not
  // configured" — it's skipped in the default layout, and adding it prompts
  // the user to complete Channel Setup first.
  function getPresets() {
    const c = appConfig;
    const ch = encodeURIComponent(c.channel);
    const uuid = c.quickActionsUuid ? `?uuid=${encodeURIComponent(c.quickActionsUuid)}` : '';
    return {
      'quick-actions': {
        title: 'Quick Actions',
        url: c.channel ? `https://dashboard.twitch.tv/popout/u/${ch}/stream-manager/quick-actions${uuid}` : '',
        w: 4, h: 6
      },
      'activity-feed': {
        title: 'Activity Feed',
        url: c.seActivityUrl,
        w: 4, h: 6,
        type: 'webview'  // must be webview — iframe blocks SE auth cookies (third-party SameSite policy)
      },
      'chat': {
        title: 'Chat',
        url: c.channel ? `https://www.twitch.tv/popout/${ch}/chat?popout=` : '',
        w: 4, h: 12,
        type: 'webview'  // rendered as BrowserView so 7TV extension can inject
      },
      'stream': {
        title: 'Live Preview',
        url: c.channel ? `https://player.twitch.tv/?channel=${ch}&parent=localhost&muted=true&autoplay=true&quality=chunked` : '',
        w: 8, h: 6,
        type: 'webview', // BrowserView — own renderer process, immune to main-window focus/blur
        stream: true     // signals buildPanelHTML to include the mute toggle button
      },
      'tikfinity-chat': {
        title: 'TikTok Chat',
        url: c.tikfinityCid ? `https://tikfinity.zerody.one/widget/activity-feed?cid=${encodeURIComponent(c.tikfinityCid)}&did=1` : '',
        w: 4, h: 6
      },
      'tikfinity-views': {
        title: 'TikTok Views',
        url: c.tikfinityCid ? `https://tikfinity.zerody.one/widget/viewercount?cid=${encodeURIComponent(c.tikfinityCid)}` : '',
        w: 2, h: 2
      },
      'predictions': {
        title: 'Predictions',
        url: c.channel ? `https://www.twitch.tv/popout/${ch}/predictions/summary` : '',
        w: 4, h: 6
      },
      'sub-goal': {
        title: 'Sub Goal',
        url: c.seOverlayUrl,
        w: 4, h: 3
      },
      'stream-manager': {
        title: 'Stream Manager',
        url: c.channel ? `https://dashboard.twitch.tv/u/${ch}/stream-manager` : '',
        w: 6, h: 9
      }
    };
  }

  const DEFAULT_LAYOUT = [
    { id: 'p-quick-actions-default', preset: 'quick-actions', x: 0, y: 0,  w: 4, h: 6 },
    { id: 'p-activity-feed-default', preset: 'activity-feed', x: 4, y: 0,  w: 4, h: 6 },
    { id: 'p-chat-default',          preset: 'chat',          x: 8, y: 0,  w: 4, h: 12 },
    { id: 'p-stream-default',        preset: 'stream',        x: 0, y: 6,  w: 8, h: 6 }
  ];

  const DEFAULT_SETTINGS = {
    columns: 126,
    rows: 126,
    gap: 0,
    float: true,
    animate: false,  // animations during drag cause visible lag; off by default
    statsBar: true,     // Twitch dashboard stats strip at the top
    statsHidden: [],    // labels removed entirely via the ⚙ menu
    statsMasked: [],    // labels whose value is masked (click a stat to toggle)
    statsOrder: []      // custom tile order from drag-to-reorder
  };

  // ============ STATE ============
  let grid;
  let panels = {};
  let closedPanels = [];
  let isLocked = false;
  let settings = { ...DEFAULT_SETTINGS };

  // ============ SETTINGS ============
  function loadSettings() {
    const saved = localStorage.getItem('dashboard-settings');
    if (saved) {
      try { settings = { ...DEFAULT_SETTINGS, ...JSON.parse(saved) }; }
      catch { settings = { ...DEFAULT_SETTINGS }; }
    }
    applySettings();
  }

  function saveSettings() {
    localStorage.setItem('dashboard-settings', JSON.stringify(settings));
  }

  function applySettings() {
    document.documentElement.style.setProperty('--gap', settings.gap + 'px');

    if (grid) {
      grid.cellHeight(calculateCellHeight());
      grid.float(settings.float);
      grid.opts.animate = settings.animate;
      grid.margin(settings.gap);
    }
  }

  let pendingSettings = null;

  function openSettings() {
    pendingSettings = { ...settings };

    document.getElementById('setting-columns').value = settings.columns;
    document.getElementById('setting-columns-val').textContent = settings.columns;
    document.getElementById('setting-rows').value = settings.rows;
    document.getElementById('setting-rows-val').textContent = settings.rows;
    document.getElementById('setting-gap').value = settings.gap;
    document.getElementById('setting-gap-val').textContent = settings.gap;
    document.getElementById('setting-float').checked = settings.float;
    document.getElementById('setting-animate').checked = settings.animate;

    document.getElementById('settings-modal').classList.add('show');
    document.body.classList.add('modal-open');
  }

  function closeSettings() {
    if (!pendingSettings) {
      document.getElementById('settings-modal').classList.remove('show');
      document.body.classList.remove('modal-open');
      return;
    }

    const colsChanged = pendingSettings.columns !== settings.columns;
    const rowsChanged = pendingSettings.rows !== settings.rows;
    const needsReload = colsChanged || rowsChanged;

    saveLayout();
    if (colsChanged) scaleLayoutColumns(settings.columns, pendingSettings.columns);
    if (rowsChanged) scaleLayoutRows(settings.rows, pendingSettings.rows);

    settings = { ...pendingSettings };
    pendingSettings = null;
    saveSettings();

    document.getElementById('settings-modal').classList.remove('show');
    document.body.classList.remove('modal-open');

    if (needsReload) {
      window.electronAPI?.bvDestroyAll();
      location.reload();
    } else {
      applySettings();
    }
  }

  function cancelSettings() {
    pendingSettings = null;
    document.getElementById('settings-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
    applySettings();
  }

  function bindSettingsControls() {
    document.getElementById('setting-columns').addEventListener('input', e => {
      const v = parseInt(e.target.value);
      if (pendingSettings) pendingSettings.columns = v;
      document.getElementById('setting-columns-val').textContent = v;
    });

    document.getElementById('setting-rows').addEventListener('input', e => {
      const v = parseInt(e.target.value);
      if (pendingSettings) pendingSettings.rows = v;
      document.getElementById('setting-rows-val').textContent = v;
    });

    document.getElementById('setting-gap').addEventListener('input', e => {
      const v = parseInt(e.target.value);
      if (pendingSettings) pendingSettings.gap = v;
      document.getElementById('setting-gap-val').textContent = v;
      document.documentElement.style.setProperty('--gap', v + 'px');
      if (grid) {
        grid.margin(v);
        grid.cellHeight(calculateCellHeightForRows(settings.rows, v));
      }
    });

    document.getElementById('setting-float').addEventListener('change', e => {
      if (pendingSettings) pendingSettings.float = e.target.checked;
      if (grid) grid.float(e.target.checked);
    });

    document.getElementById('setting-animate').addEventListener('change', e => {
      if (pendingSettings) pendingSettings.animate = e.target.checked;
      if (grid) grid.opts.animate = e.target.checked;
    });
  }

  async function resetSettings() {
    const ok = await showConfirm('Reset Settings',
      'Reset all settings to defaults? Panel positions are kept.', 'Reset');
    if (!ok) return;
    settings = { ...DEFAULT_SETTINGS };
    saveSettings();
    window.electronAPI?.bvDestroyAll();
    location.reload();
  }

  function scaleLayoutColumns(oldCols, newCols) {
    const saved = localStorage.getItem('dashboard-layout');
    if (!saved) return;
    try {
      const nodes = JSON.parse(saved);
      const ratio = newCols / oldCols;
      const scaled = nodes.map(n => ({
        ...n,
        x: Math.round(n.x * ratio),
        w: Math.max(1, Math.round(n.w * ratio))
      }));
      scaled.forEach(n => {
        if (n.x + n.w > newCols) n.w = newCols - n.x;
        if (n.w < 1) { n.x = 0; n.w = Math.min(newCols, 4); }
      });
      localStorage.setItem('dashboard-layout', JSON.stringify(scaled));
    } catch (e) { console.warn('scaleLayoutColumns failed', e); }
  }

  function scaleLayoutRows(oldRows, newRows) {
    const saved = localStorage.getItem('dashboard-layout');
    if (!saved) return;
    try {
      const nodes = JSON.parse(saved);
      const ratio = newRows / oldRows;
      const scaled = nodes.map(n => ({
        ...n,
        y: Math.round(n.y * ratio),
        h: Math.max(1, Math.round(n.h * ratio))
      }));
      localStorage.setItem('dashboard-layout', JSON.stringify(scaled));
    } catch (e) { console.warn('scaleLayoutRows failed', e); }
  }

  // ============ INIT ============
  function calculateCellHeight() {
    return calculateCellHeightForRows(settings.rows, settings.gap);
  }

  function calculateCellHeightForRows(rows, gap) {
    // Grid height is the wrapper, not the window — the stats bar (when shown)
    // takes its slice off the top.
    const wrapper = document.getElementById('grid-wrapper');
    const totalGap = gap * (rows + 1);
    const available = (wrapper ? wrapper.clientHeight : window.innerHeight) - totalGap;
    return Math.max(1, available / rows);
  }

  function injectColumnCSS(columnCount) {
    const styleId = 'gridstack-custom-columns';
    let style = document.getElementById(styleId);
    if (!style) {
      style = document.createElement('style');
      style.id = styleId;
      document.head.appendChild(style);
    }

    let css = '';
    const pct = 100 / columnCount;
    for (let i = 0; i <= columnCount; i++) {
      css += `.grid-stack > .grid-stack-item[gs-w="${i}"] { width: ${pct * i}%; }\n`;
      css += `.grid-stack > .grid-stack-item[gs-x="${i}"] { left: ${pct * i}%; }\n`;
      css += `.grid-stack > .grid-stack-item[gs-min-w="${i}"] { min-width: ${pct * i}%; }\n`;
      css += `.grid-stack > .grid-stack-item[gs-max-w="${i}"] { max-width: ${pct * i}%; }\n`;
    }
    style.textContent = css;
  }

  function initGrid() {
    injectColumnCSS(settings.columns);

    grid = GridStack.init({
      column: settings.columns,
      cellHeight: calculateCellHeight(),
      margin: settings.gap,
      float: settings.float,
      animate: settings.animate,
      maxRow: settings.rows,
      resizable: { handles: 'all' },
      draggable: { handle: '.panel-header' },
      disableOneColumnMode: true
    });

    grid.on('dragstart', () => {
      document.body.classList.add('dragging');
      bvHide();
    });
    grid.on('dragstop', (e, el) => {
      document.body.classList.remove('dragging');
      autoFillPanel(el?.gridstackNode, el);
      bvShow();
      saveLayout();
    });

    setupResizeHandlers();
    setupEdgeDoubleClick();

    grid.on('change',        () => { saveLayout(); syncAllBVBounds(); });
    grid.on('added removed', () => { saveLayout(); syncAllBVBounds(); });

    let bvSyncTimer;
    window.addEventListener('resize', () => {
      // Update cell height immediately so panels scale with the window — no debounce
      if (grid) grid.cellHeight(calculateCellHeight());
      // BV bounds sync is more expensive; debounce it until resize settles
      clearTimeout(bvSyncTimer);
      bvSyncTimer = setTimeout(syncAllBVBounds, 120);
    });
  }

  // ============ RESIZE EVENTS ============
  function setupResizeHandlers() {
    grid.on('resizestart', () => {
      document.body.classList.add('dragging');
      bvHide();
    });
    grid.on('resizestop', (e, el) => {
      document.body.classList.remove('dragging');
      tileAdjacentPanels(el?.gridstackNode);
      bvShow();
      saveLayout();
    });
  }

  function tileAdjacentPanels(node) {
    if (!node || !grid) return;
    let changed = false;

    const others = grid.engine.nodes.filter(n => n.id !== node.id && !n.locked);

    for (const o of others) {
      const xOverlap = node.x < o.x + o.w && node.x + node.w > o.x;
      const yOverlap = node.y < o.y + o.h && node.y + node.h > o.y;
      if (!xOverlap || !yOverlap) continue;

      const options = [];

      if (node.x > o.x) {
        const newW = node.x - o.x;
        if (newW >= 1) options.push({ cost: o.w - newW, update: { w: newW } });
      }
      if (node.x + node.w < o.x + o.w) {
        const newX = node.x + node.w;
        const newW = (o.x + o.w) - newX;
        if (newW >= 1) options.push({ cost: o.w - newW, update: { x: newX, w: newW } });
      }
      if (node.y > o.y) {
        const newH = node.y - o.y;
        if (newH >= 1) options.push({ cost: o.h - newH, update: { h: newH } });
      }
      if (node.y + node.h < o.y + o.h) {
        const newY = node.y + node.h;
        const newH = (o.y + o.h) - newY;
        if (newH >= 1) options.push({ cost: o.h - newH, update: { y: newY, h: newH } });
      }

      if (options.length === 0) continue;

      options.sort((a, b) => a.cost - b.cost);
      grid.update(o.el, options[0].update);
      changed = true;
    }

    if (changed) {
      syncAllBVBounds();
      saveLayout();
    }
  }

  function setupEdgeDoubleClick() {
    document.getElementById('grid').addEventListener('dblclick', e => {
      const handle = e.target.closest('.ui-resizable-handle');
      if (!handle) return;
      const item = handle.closest('.grid-stack-item');
      if (!item) return;
      e.preventDefault();
      e.stopPropagation();
      const node = item.gridstackNode;
      if (!node) return;

      const toRight  = handle.classList.contains('ui-resizable-e')  ||
                       handle.classList.contains('ui-resizable-ne') ||
                       handle.classList.contains('ui-resizable-se');
      const toBottom = handle.classList.contains('ui-resizable-s')  ||
                       handle.classList.contains('ui-resizable-se') ||
                       handle.classList.contains('ui-resizable-sw');
      const toLeft   = handle.classList.contains('ui-resizable-w')  ||
                       handle.classList.contains('ui-resizable-nw') ||
                       handle.classList.contains('ui-resizable-sw');
      const toTop    = handle.classList.contains('ui-resizable-n')  ||
                       handle.classList.contains('ui-resizable-ne') ||
                       handle.classList.contains('ui-resizable-nw');

      const cols    = grid.opts.column;
      const maxRows = settings.rows;
      const others  = grid.engine.nodes.filter(n => n.id !== node.id);

      const nearestRight = () => {
        const hit = others.filter(n =>
          n.x >= node.x + node.w &&
          n.y < node.y + node.h && n.y + n.h > node.y
        ).sort((a, b) => a.x - b.x)[0];
        return hit ? hit.x - node.x : cols - node.x;
      };
      const nearestBottom = () => {
        const hit = others.filter(n =>
          n.y >= node.y + node.h &&
          n.x < node.x + node.w && n.x + n.w > node.x
        ).sort((a, b) => a.y - b.y)[0];
        return hit ? hit.y - node.y : maxRows - node.y;
      };
      const nearestLeft = () => {
        const hit = others.filter(n =>
          n.x + n.w <= node.x &&
          n.y < node.y + node.h && n.y + n.h > node.y
        ).sort((a, b) => b.x - a.x)[0];
        return hit ? hit.x + hit.w : 0;
      };
      const nearestTop = () => {
        const hit = others.filter(n =>
          n.y + n.h <= node.y &&
          n.x < node.x + node.w && n.x + n.w > node.x
        ).sort((a, b) => b.y - a.y)[0];
        return hit ? hit.y + hit.h : 0;
      };

      const updates = {};
      if (toRight)  updates.w = nearestRight();
      if (toBottom) updates.h = nearestBottom();
      if (toLeft)  { const nx = nearestLeft(); updates.x = nx; updates.w = node.x + node.w - nx; }
      if (toTop)   { const ny = nearestTop();  updates.y = ny; updates.h = node.y + node.h - ny; }

      if (Object.keys(updates).length > 0) {
        grid.update(item, updates);
        syncAllBVBounds();
        saveLayout();
      }
    });
  }

  function autoFillPanel(node, el) {
    if (!node || !el) return;
    const cols    = grid.opts.column;
    const maxRows = settings.rows;
    const others  = grid.engine.nodes.filter(n => n.id !== node.id);

    const cellOccupied = (col, row) =>
      others.some(n => n.x <= col && col < n.x + n.w && n.y <= row && row < n.y + n.h);

    let newW = node.w;
    for (let col = node.x + node.w; col < cols; col++) {
      const blocked = Array.from({ length: node.h }, (_, i) => node.y + i)
                           .some(row => cellOccupied(col, row));
      if (blocked) break;
      newW++;
    }

    let newH = node.h;
    for (let row = node.y + node.h; row < maxRows; row++) {
      const blocked = Array.from({ length: newW }, (_, i) => node.x + i)
                           .some(col => cellOccupied(col, row));
      if (blocked) break;
      newH++;
    }

    if (newW !== node.w || newH !== node.h) {
      grid.update(el, { w: newW, h: newH });
    }
  }

  // ── BrowserView panel management ─────────────────────────────────────────────
  // BVs are native overlays that always paint above the DOM, so they must be
  // hidden while menus/modals/drags are active. To avoid panels going blank,
  // bvHide first swaps in a screenshot of each view (freeze frame) — UI chrome
  // then appears to float over the (frozen) panel content.
  let _bvHideCount = 0;
  let _freezeToken = 0;

  async function bvHide() {
    if (_bvHideCount++ !== 0) return;
    const token = ++_freezeToken;
    try {
      const shots = await window.electronAPI?.bvFreeze();
      if (token === _freezeToken && _bvHideCount > 0 && shots) showFreezeFrames(shots);
    } catch {}
    if (token === _freezeToken && _bvHideCount > 0) window.electronAPI?.bvSetVisible(false);
  }

  function bvShow() {
    _bvHideCount = Math.max(0, _bvHideCount - 1);
    if (_bvHideCount === 0) {
      _freezeToken++; // cancel any in-flight freeze capture
      syncAllBVBounds();
      window.electronAPI?.bvSetVisible(true);
      // Let the live views paint before removing their stand-ins
      setTimeout(clearFreezeFrames, 120);
    }
  }

  function showFreezeFrames(shots) {
    for (const { id, dataURL } of shots) {
      const body = document.querySelector(`#content-${id} .panel-body`);
      if (!body) continue;
      let img = body.querySelector('img.bv-freeze');
      if (!img) {
        img = document.createElement('img');
        img.className = 'bv-freeze';
        img.alt = '';
        body.appendChild(img);
      }
      img.src = dataURL;
    }
  }

  function clearFreezeFrames() {
    if (_bvHideCount > 0) return; // a new hide started meanwhile — keep frames
    document.querySelectorAll('img.bv-freeze').forEach(el => el.remove());
  }

  // Re-sync BV bounds every frame for the duration of a CSS transition, so
  // native views scale smoothly along with their animating panel bodies.
  let _bvAnimUntil = 0;
  let _bvAnimRunning = false;
  function animateBVSync(ms) {
    _bvAnimUntil = performance.now() + ms;
    if (_bvAnimRunning) return;
    _bvAnimRunning = true;
    const step = () => {
      if (_bvHideCount === 0) syncAllBVBounds();
      if (performance.now() < _bvAnimUntil) requestAnimationFrame(step);
      else _bvAnimRunning = false;
    };
    requestAnimationFrame(step);
  }

  // ── Locked-mode header reveal ────────────────────────────────────────────────
  // While locked, headers are collapsed; resting on the top edge of a panel
  // slides its header in. Cursor positions arrive from main (see hover-watch)
  // because mouse events over BrowserViews never reach this document.
  //
  // Tuned to require intent: a narrow trigger band, a dwell delay before the
  // header appears, a taller keep-open band (hysteresis) so it doesn't flicker
  // once shown, and a short arming delay before the buttons accept clicks —
  // so brushing past the top of a panel can never land a click on Close.
  const REVEAL_BAND  = 10;  // px from the top edge that starts a reveal
  const REVEAL_KEEP  = 34;  // px within which an already-open header stays open
  const REVEAL_DELAY = 400; // ms the cursor must dwell in the band
  const ARM_DELAY    = 220; // ms after reveal before actions become clickable

  let _revealedEl   = null;
  let _revealTimer  = null;
  let _armTimer     = null;
  let _pendingEl    = null;

  function setRevealedPanel(el) {
    if (el === _revealedEl) return;
    clearTimeout(_armTimer);
    _revealedEl?.classList.remove('reveal-header', 'armed');
    _revealedEl = el;
    if (el) {
      el.classList.add('reveal-header');
      // Buttons stay click-through until the header has settled
      _armTimer = setTimeout(() => el.classList.add('armed'), ARM_DELAY);
    }
    animateBVSync(260); // follow the 180ms height transition with margin
  }

  function handleCursorPos({ x, y, inside }) {
    if (!isLocked || document.body.classList.contains('modal-open')) {
      clearTimeout(_revealTimer);
      _pendingEl = null;
      setRevealedPanel(null);
      return;
    }

    const hit = (band) => {
      if (!inside) return null;
      for (const item of document.querySelectorAll('.grid-stack-item')) {
        const r = item.getBoundingClientRect();
        if (x >= r.left && x < r.right && y >= r.top && y < r.top + band) return item;
      }
      return null;
    };

    // Keep an open header open across a taller band so it doesn't flicker
    // while reaching for its buttons.
    if (_revealedEl && hit(REVEAL_KEEP) === _revealedEl) {
      clearTimeout(_revealTimer);
      _pendingEl = null;
      return;
    }

    const target = hit(REVEAL_BAND);

    // Order matters: cancel any pending reveal FIRST. Checking
    // `target === _revealedEl` up front would early-return when both are null
    // and leave a queued timer alive, popping the header open after the cursor
    // had already moved away.
    if (!target) {                    // left the edge — close, cancel any pending
      clearTimeout(_revealTimer);
      _pendingEl = null;
      setRevealedPanel(null);
      return;
    }
    if (target === _revealedEl) {     // already open on this panel
      clearTimeout(_revealTimer);
      _pendingEl = null;
      return;
    }
    if (target === _pendingEl) return; // already waiting on this panel

    clearTimeout(_revealTimer);
    _pendingEl = target;
    _revealTimer = setTimeout(() => {
      _pendingEl = null;
      setRevealedPanel(target);
    }, REVEAL_DELAY);
  }

  function getBVBounds(id) {
    const body = document.querySelector(`#content-${id} .panel-body`);
    if (!body) return null;
    const r = body.getBoundingClientRect();
    if (r.width <= 0 || r.height <= 0) return null;
    const x = Math.round(r.left);
    const y = Math.round(r.top);
    // Snap to window edges when within 2px — prevents sub-pixel floating-point
    // gaps (e.g. 126-row grid with non-integer cell height) from clipping BV content.
    const SNAP = 2;
    const w = (r.right  >= window.innerWidth  - SNAP) ? window.innerWidth  - x : Math.round(r.width);
    const h = (r.bottom >= window.innerHeight - SNAP) ? window.innerHeight - y : Math.round(r.height);
    return { x, y, w, h };
  }

  function isBVPanel(cfg) { return cfg.type === 'webview' || cfg.type === 'stream'; }

  function syncAllBVBounds() {
    if (!window.electronAPI) return;
    const updates = [];
    for (const [id, cfg] of Object.entries(panels)) {
      if (!isBVPanel(cfg)) continue;
      const bounds = getBVBounds(id);
      if (bounds) updates.push({ id, bounds });
    }
    if (updates.length) window.electronAPI.bvSetAllBounds(updates);
  }

  function createBVPanel(id) {
    const cfg = panels[id];
    if (!cfg || !isBVPanel(cfg)) return;
    let attempts = 0;
    const tryCreate = () => {
      const bounds = getBVBounds(id);
      if (bounds) {
        window.electronAPI?.bvCreate({ id, url: cfg.url, bounds });
        requestAnimationFrame(syncAllBVBounds);
      } else if (++attempts < 20) {
        requestAnimationFrame(tryCreate);
      } else {
        const item = document.querySelector(`#content-${id}`)?.closest('.grid-stack-item');
        const body = document.querySelector(`#content-${id} .panel-body`);
        if (body && item) {
          const r = body.getBoundingClientRect();
          const h = Math.max(1, parseFloat(item.style.height || '0') - 28 - 2);
          window.electronAPI?.bvCreate({
            id, url: cfg.url,
            bounds: { x: Math.round(r.left), y: Math.round(r.top),
                      w: Math.max(1, Math.round(r.width)), h }
          });
        }
      }
    };
    requestAnimationFrame(tryCreate);
  }

  function destroyBVPanel(id) {
    window.electronAPI?.bvDestroy({ id });
  }

  let _modalWasOpen = false;
  new MutationObserver(() => {
    const open = document.body.classList.contains('modal-open');
    if (open && !_modalWasOpen)  { _modalWasOpen = true;  bvHide(); }
    if (!open && _modalWasOpen)  { _modalWasOpen = false; bvShow(); }
  }).observe(document.body, { attributes: true, attributeFilter: ['class'] });

  document.getElementById('grid-wrapper').addEventListener('scroll', () => {
    if (_bvHideCount === 0) syncAllBVBounds();
  });

  // ============ PANEL HTML ============
  function buildPanelHTML(id, config) {
    const { title, url, type } = config;

    if (type === 'webview' || type === 'stream') {
      let muteBtn = '';
      if (config.stream) {
        let isMuted = true;
        try { isMuted = new URL(config.url).searchParams.get('muted') !== 'false'; } catch {}
        muteBtn = `<button onclick="toggleStreamMute('${id}')" title="Toggle mute"><span class="mute-icon">${isMuted ? '&#128263;' : '&#128266;'}</span></button>`;
      }
      return `
        <div class="panel-header">
          <div class="type-stripe"></div>
          <div class="title-group">
            <span class="title-text">${escapeHtml(title)}</span>
          </div>
          <div class="actions">
            ${muteBtn}
            <button onclick="editPanelUrl('${id}')" title="Edit URL">&#9998;</button>
            <button onclick="reloadPanel('${id}')" title="Reload">&#8635;</button>
            <button class="close-btn" onclick="closePanel('${id}')" title="Close">&#10005;</button>
          </div>
        </div>
        <div class="panel-body"></div>
      `;
    }

    return `
      <div class="panel-header">
        <div class="type-stripe"></div>
        <div class="title-group">
          <span class="title-text">${escapeHtml(title)}</span>
        </div>
        <div class="actions">
          <button onclick="editPanelUrl('${id}')" title="Edit URL">&#9998;</button>
          <button onclick="reloadPanel('${id}')" title="Reload">&#8635;</button>
          <button class="close-btn" onclick="closePanel('${id}')" title="Close">&#10005;</button>
        </div>
      </div>
      <div class="panel-body">
        <iframe src="${escapeHtml(url)}" allow="clipboard-read; clipboard-write"></iframe>
      </div>
    `;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ============ CRUD ============
  function addPanel(id, config, gridOpts = {}) {
    const w = gridOpts.w || config.w || 8;
    const h = gridOpts.h || config.h || 12;
    const x = gridOpts.x;
    const y = gridOpts.y;

    const typeClass = `panel-type-${config.preset || 'custom'}`;

    const widget = {
      id,
      w, h,
      ...(x !== undefined ? { x } : {}),
      ...(y !== undefined ? { y } : {}),
      content: `<div class="grid-stack-item-content ${typeClass}" id="content-${id}">${buildPanelHTML(id, config)}</div>`
    };

    grid.addWidget(widget);
    panels[id] = config;
    if (isBVPanel(config)) createBVPanel(id);
    saveLayout();
  }

  function closePanel(id) {
    const config = panels[id];
    if (!config) return;
    const node = grid.engine.nodes.find(n => n.id === id);
    if (!node) return;

    if (isBVPanel(config)) destroyBVPanel(id);
    closedPanels.push({ ...config, w: node.w, h: node.h });
    grid.removeWidget(node.el, true);
    delete panels[id];
    saveLayout();
    saveClosedPanels();
    notifyMenuUpdate();
  }

  function reopenPanel(idx) {
    const config = closedPanels.splice(idx, 1)[0];
    if (!config) return;
    const newId = `p-${config.preset || 'custom'}-${Date.now()}`;
    addPanel(newId, config, { w: config.w, h: config.h });
    saveClosedPanels();
    notifyMenuUpdate();
  }

  // ============ DIALOGS ============
  function addPanelDialog() {
    document.getElementById('add-modal').classList.add('show');
    document.body.classList.add('modal-open');
  }
  function closeAddModal() {
    document.getElementById('add-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
    document.getElementById('custom-name').value = '';
    document.getElementById('custom-url').value = '';
  }
  async function addPresetPanel(presetKey) {
    const preset = getPresets()[presetKey];
    if (!preset) return;
    if (!preset.url) {
      closeAddModal();
      await showConfirm('Setup Needed',
        `"${preset.title}" needs its channel/ID configured first. Opening Channel Setup…`, 'OK');
      openSetup();
      return;
    }
    const id = `p-${presetKey}-${Date.now()}`;
    addPanel(id, { ...preset, preset: presetKey });
    closeAddModal();
  }
  async function addCustomPanel() {
    const name = document.getElementById('custom-name').value.trim();
    const url = document.getElementById('custom-url').value.trim();
    if (!name || !url) {
      await showConfirm('Missing Fields', 'Please provide both a name and a URL.', 'OK');
      return;
    }
    const id = `p-custom-${Date.now()}`;
    addPanel(id, { title: name, url, w: 8, h: 12 });
    closeAddModal();
  }

  // ============ SAVED LAYOUTS ============
  function getSavedLayouts() {
    try { return JSON.parse(localStorage.getItem('dashboard-saved-layouts') || '[]'); }
    catch { return []; }
  }
  function setSavedLayouts(layouts) {
    localStorage.setItem('dashboard-saved-layouts', JSON.stringify(layouts));
  }
  function captureCurrentLayout() {
    if (!grid) return null;
    const nodes = grid.engine.nodes.map(n => ({
      id: n.id, x: n.x, y: n.y, w: n.w, h: n.h, config: panels[n.id]
    })).filter(n => n.config);
    return { panels: nodes, columns: settings.columns, rows: settings.rows, gap: settings.gap, savedAt: Date.now() };
  }
  function saveCurrentAsLayout() {
    document.getElementById('save-layout-name').value = '';
    document.getElementById('save-layout-modal').classList.add('show');
    document.body.classList.add('modal-open');
    setTimeout(() => document.getElementById('save-layout-name').focus(), 50);
  }
  function closeSaveLayoutModal() {
    document.getElementById('save-layout-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
  }
  async function confirmSaveLayout() {
    const name = document.getElementById('save-layout-name').value.trim();
    if (!name) return;
    closeSaveLayoutModal();
    const layouts = getSavedLayouts();
    const existingIdx = layouts.findIndex(l => l.name === name);
    if (existingIdx >= 0) {
      const ok = await showConfirm('Overwrite Layout',
        `A layout named "${name}" already exists. Overwrite it?`, 'Overwrite');
      if (!ok) return;
      layouts.splice(existingIdx, 1);
    }
    const captured = captureCurrentLayout();
    if (!captured) return;
    layouts.push({ name, ...captured });
    setSavedLayouts(layouts);
    notifyMenuUpdate();
  }
  async function loadSavedLayout(idx) {
    const layouts = getSavedLayouts();
    const layout = layouts[idx];
    if (!layout) return;
    const ok = await showConfirm('Load Layout',
      `Load "${layout.name}"? Your current panel positions will be replaced.`, 'Load');
    if (!ok) return;
    const newSettings = { ...settings, columns: layout.columns, rows: layout.rows,
      gap: layout.gap !== undefined ? layout.gap : settings.gap };
    localStorage.setItem('dashboard-settings', JSON.stringify(newSettings));
    localStorage.setItem('dashboard-layout', JSON.stringify(layout.panels));
    localStorage.setItem('dashboard-version', String(LAYOUT_VERSION));
    window.electronAPI?.bvDestroyAll();
    location.reload();
  }
  async function deleteSavedLayout(idx, event) {
    if (event) event.stopPropagation();
    const layouts = getSavedLayouts();
    const layout = layouts[idx];
    if (!layout) return;
    const ok = await showConfirm('Delete Layout', `Delete "${layout.name}"?`, 'Delete');
    if (!ok) return;
    layouts.splice(idx, 1);
    setSavedLayouts(layouts);
    notifyMenuUpdate();
  }

  // ============ PANEL ACTIONS ============
  function reloadPanel(id) {
    if (isBVPanel(panels[id])) {
      window.electronAPI?.bvReload({ id });
      return;
    }
    const content = document.getElementById(`content-${id}`);
    if (!content) return;
    content.querySelectorAll('iframe').forEach(f => { f.src = f.src; });
  }

  function toggleStreamMute(id) {
    const cfg = panels[id];
    if (!cfg || !cfg.stream) return;
    const url = new URL(cfg.url);
    const wasMuted = url.searchParams.get('muted') !== 'false';
    url.searchParams.set('muted', wasMuted ? 'false' : 'true');
    cfg.url = url.toString();
    window.electronAPI?.bvNavigate({ id, url: cfg.url });
    const icon = document.querySelector(`#content-${id} .mute-icon`);
    if (icon) icon.innerHTML = wasMuted ? '&#128266;' : '&#128263;';
    saveLayout();
  }

  let _editingPanelId = null;
  function editPanelUrl(id) {
    const config = panels[id];
    if (!config) return;
    _editingPanelId = id;
    document.getElementById('edit-url-input').value = config.url;
    document.getElementById('edit-url-modal').classList.add('show');
    document.body.classList.add('modal-open');
    setTimeout(() => {
      const inp = document.getElementById('edit-url-input');
      inp.focus(); inp.select();
    }, 50);
  }
  function closeEditUrlModal() {
    _editingPanelId = null;
    document.getElementById('edit-url-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
  }
  async function confirmEditUrl() {
    const raw = document.getElementById('edit-url-input').value.trim();
    if (!raw) return;
    try { new URL(raw); } catch {
      await showConfirm('Invalid URL', 'Please enter a valid URL starting with https://', 'OK');
      return;
    }
    closeEditUrlModal();
    const id = _editingPanelId;
    if (!id || !panels[id]) return;
    panels[id].url = raw;
    if (panels[id].type === 'webview') {
      window.electronAPI?.bvNavigate({ id, url: raw });
    } else {
      const content = document.getElementById(`content-${id}`);
      if (content) content.querySelectorAll('iframe').forEach(f => { f.src = raw; });
    }
    saveLayout();
  }

  function reloadAll() {
    Object.entries(panels).forEach(([id, cfg]) => {
      if (isBVPanel(cfg)) window.electronAPI?.bvReload({ id });
    });
    document.querySelectorAll('.grid-stack iframe').forEach(f => { f.src = f.src; });
  }

  function applyLock() {
    document.body.classList.toggle('locked', isLocked);
    grid.engine.nodes.forEach(node => {
      grid.update(node.el, { noMove: isLocked, noResize: isLocked, locked: isLocked });
    });
    localStorage.setItem('dashboard-locked', JSON.stringify(isLocked));
    // Headers collapse (locked) or return (unlocked) — track the 180ms height
    // transition so BV content scales smoothly into the reclaimed space.
    if (!isLocked) setRevealedPanel(null);
    window.electronAPI?.hoverWatch(isLocked);
    animateBVSync(300);
  }

  function toggleLock() {
    isLocked = !isLocked;
    applyLock();
  }

  function loadLockState() {
    try {
      const saved = localStorage.getItem('dashboard-locked');
      isLocked = saved !== null ? JSON.parse(saved) : true; // default: locked
    } catch { isLocked = true; }
    applyLock();
  }

  async function resetLayout() {
    const ok = await showConfirm('Reset Layout',
      'Reset to the default layout? Custom panels will be removed and positions cleared.', 'Reset');
    if (!ok) return;
    localStorage.removeItem('dashboard-layout');
    localStorage.removeItem('dashboard-closed');
    localStorage.removeItem('dashboard-version');
    const newSettings = { ...settings, columns: DEFAULT_SETTINGS.columns, rows: DEFAULT_SETTINGS.rows };
    localStorage.setItem('dashboard-settings', JSON.stringify(newSettings));
    window.electronAPI?.bvDestroyAll();
    location.reload();
  }

  // ============ PERSISTENCE ============
  const LAYOUT_VERSION = 2;

  function saveLayout() {
    if (!grid) return;
    const nodes = grid.engine.nodes.map(n => ({
      id: n.id, x: n.x, y: n.y, w: n.w, h: n.h, config: panels[n.id]
    })).filter(n => n.config);
    localStorage.setItem('dashboard-layout', JSON.stringify(nodes));
    localStorage.setItem('dashboard-version', String(LAYOUT_VERSION));
  }

  function saveClosedPanels() {
    localStorage.setItem('dashboard-closed', JSON.stringify(closedPanels));
  }

  function loadLayout() {
    const saved = localStorage.getItem('dashboard-layout');
    const closedSaved = localStorage.getItem('dashboard-closed');
    const savedVersion = parseInt(localStorage.getItem('dashboard-version') || '1');

    if (closedSaved) {
      try { closedPanels = JSON.parse(closedSaved) || []; } catch {}
    }

    if (saved && savedVersion === LAYOUT_VERSION) {
      try {
        const nodes = JSON.parse(saved);
        if (nodes.length > 0) {
          const usable = nodes.filter(n => n.config && n.w > 0 && n.h > 0).map(n => {
            const node = { ...n };
            if (node.x < 0) node.x = 0;
            if (node.y < 0) node.y = 0;
            if (node.x + node.w > settings.columns) {
              node.w = settings.columns - node.x;
              if (node.w < 1) { node.x = 0; node.w = Math.min(settings.columns, 4); }
            }
            // Refresh preset URLs from config — but never clobber a working
            // saved URL with an empty one (config field not filled in yet).
            const fresh = node.config.preset && getPresets()[node.config.preset];
            if (fresh && fresh.url) {
              node.config.url    = fresh.url;
              node.config.type   = fresh.type;
              node.config.stream = fresh.stream || false;
            }
            return node;
          });
          if (usable.length > 0) {
            usable.forEach(n => addPanel(n.id, n.config, { x: n.x, y: n.y, w: n.w, h: n.h }));
            return;
          }
        }
      } catch (e) { console.warn('Failed to load layout', e); }
    }

    localStorage.setItem('dashboard-version', String(LAYOUT_VERSION));
    const colRatio = settings.columns / 12;
    const rowRatio = settings.rows / 12;

    const presets = getPresets();
    DEFAULT_LAYOUT.forEach(item => {
      const preset = presets[item.preset];
      if (!preset || !preset.url) return; // not configured yet — skip
      const config = { ...preset, preset: item.preset };
      addPanel(item.id, config, {
        x: Math.round(item.x * colRatio),
        y: Math.round(item.y * rowRatio),
        w: Math.max(1, Math.round(item.w * colRatio)),
        h: Math.max(1, Math.round(item.h * rowRatio))
      });
    });
  }

  // ============ CONFIRM MODAL ============
  let _confirmResolve = null;
  function showConfirm(title, message, okLabel = 'OK') {
    return new Promise(resolve => {
      _confirmResolve = resolve;
      document.getElementById('confirm-modal-title').textContent = title;
      document.getElementById('confirm-modal-body').textContent = message;
      document.getElementById('confirm-modal-ok').textContent = okLabel;
      document.getElementById('confirm-modal').classList.add('show');
      document.body.classList.add('modal-open');
    });
  }
  function resolveConfirm(result) {
    document.getElementById('confirm-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
    if (_confirmResolve) { _confirmResolve(result); _confirmResolve = null; }
  }

  // ============ UPDATE TOAST ============
  // BrowserViews are OS overlays — they sit on top of all DOM content.
  // For states that need user attention we call bvHide() so the toast is
  // visible, then bvShow() when dismissed.  Transient states are silent.
  let _toastDismissTimer = null;
  let _toastBvsHidden    = false;

  function _toastHideBVs() {
    if (!_toastBvsHidden) { _toastBvsHidden = true; bvHide(); }
  }
  function _toastShowBVs() {
    if (_toastBvsHidden) { _toastBvsHidden = false; bvShow(); }
  }

  function closeUpdateToast() {
    clearTimeout(_toastDismissTimer);
    const t = document.getElementById('update-toast');
    t.classList.remove('visible', 'state-ready', 'state-error');
    _toastShowBVs();
  }
  function closeUpdateModal() { closeUpdateToast(); }

  document.getElementById('update-toast-close').addEventListener('click', closeUpdateToast);

  function showUpdateStatus(payload) {
    clearTimeout(_toastDismissTimer);
    const toast   = document.getElementById('update-toast');
    const msg     = document.getElementById('update-toast-msg');
    const progress= document.getElementById('update-toast-progress');
    const fill    = document.getElementById('update-toast-fill');
    const actions = document.getElementById('update-toast-actions');

    toast.classList.remove('state-ready', 'state-error');
    progress.style.display = 'none';
    actions.innerHTML = '';

    switch (payload.state) {
      // ── Silent in the DOM — handled by native OS notification in main.js ──
      case 'checking':
      case 'available':
      case 'downloading':
      case 'not-available':
      case 'error':
        _toastShowBVs(); // restore BVs if they were hidden by a prior ready-state toast
        return;

      // ── Ready: DOM toast with bvHide — user must click to install or dismiss ──
      // This is the only state that needs interactive in-app buttons.
      // BrowserViews are hidden just for this toast; they stay loaded in the background.
      case 'ready':
        msg.innerHTML = `<strong>Update ready — v${payload.version}</strong>Restart to apply the update.`;
        toast.classList.add('state-ready');
        actions.innerHTML = `
          <button onclick="closeUpdateToast()">Later</button>
          <button class="primary" onclick="window.electronAPI.installUpdate()">Restart &amp; Install</button>`;
        _toastHideBVs();
        break;
    }

    toast.classList.add('visible');
  }

  // ============ CHANNEL SETUP ============
  function openSetup() {
    document.getElementById('setup-channel').value     = appConfig.channel;
    document.getElementById('setup-se-activity').value = appConfig.seActivityUrl;
    document.getElementById('setup-se-overlay').value  = appConfig.seOverlayUrl;
    document.getElementById('setup-tikfinity').value   = appConfig.tikfinityCid;
    document.getElementById('setup-qa-uuid').value     = appConfig.quickActionsUuid;
    document.getElementById('setup-modal').classList.add('show');
    document.body.classList.add('modal-open');
    setTimeout(() => document.getElementById('setup-channel').focus(), 50);
  }

  function closeSetup() {
    document.getElementById('setup-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
  }

  async function saveSetup() {
    const channel = document.getElementById('setup-channel').value.trim()
      .replace(/^https?:\/\/(www\.)?twitch\.tv\//i, '').replace(/\/.*$/, ''); // accept pasted URLs
    if (!/^[a-zA-Z0-9_]{3,32}$/.test(channel)) {
      await showConfirm('Invalid Channel', 'Please enter a valid Twitch channel name (letters, numbers, underscores).', 'OK');
      return;
    }
    const changed =
      channel !== appConfig.channel ||
      document.getElementById('setup-se-activity').value.trim() !== appConfig.seActivityUrl ||
      document.getElementById('setup-se-overlay').value.trim()  !== appConfig.seOverlayUrl ||
      document.getElementById('setup-tikfinity').value.trim()   !== appConfig.tikfinityCid ||
      document.getElementById('setup-qa-uuid').value.trim()     !== appConfig.quickActionsUuid;

    appConfig.channel          = channel;
    appConfig.seActivityUrl    = document.getElementById('setup-se-activity').value.trim();
    appConfig.seOverlayUrl     = document.getElementById('setup-se-overlay').value.trim();
    appConfig.tikfinityCid     = document.getElementById('setup-tikfinity').value.trim();
    appConfig.quickActionsUuid = document.getElementById('setup-qa-uuid').value.trim();
    saveConfig();
    closeSetup();

    if (changed) {
      // Panel URLs are derived from config — rebuild everything
      window.electronAPI?.bvDestroyAll();
      window.electronAPI?.statsStop();
      location.reload();
    }
  }

  // ============ STATS BAR ============
  // Data arrives from main as [{ label, value }, …] scraped from the Twitch
  // dashboard (see main.js). The bar and each individual stat are hideable;
  // hiding the whole bar also destroys the hidden scraper view in main.
  let _lastStats = [];

  function statsBarActive() {
    return settings.statsBar && !!appConfig.channel && !!window.electronAPI;
  }

  function applyStatsBar() {
    const bar = document.getElementById('stats-bar');
    const active = statsBarActive();
    bar.classList.toggle('hidden', !active);
    if (active) window.electronAPI.statsStart(appConfig.channel);
    else        window.electronAPI?.statsStop();
    // Bar visibility changes the grid's height — rescale rows and re-pin BVs
    if (grid) grid.cellHeight(calculateCellHeight());
    setTimeout(syncAllBVBounds, 50);
  }

  function toggleStatsBar() {
    settings.statsBar = !settings.statsBar;
    saveSettings();
    closeStatsMenu();
    applyStatsBar();
  }

  // Tiles behave like Twitch's own stats strip: click a stat to mask/unmask
  // its value (kept in place, shown as •••), drag a tile to reorder. Removing
  // a stat entirely still lives in the ⚙ menu.
  let _statsDragLabel = null;

  function orderedVisibleStats() {
    const order = settings.statsOrder;
    const idx = l => { const i = order.indexOf(l); return i === -1 ? order.length : i; };
    return _lastStats
      .filter(s => !settings.statsHidden.includes(s.label))
      .sort((a, b) => idx(a.label) - idx(b.label));
  }

  function renderStats() {
    const wrap = document.getElementById('stats-items');
    wrap.replaceChildren();
    const visible = orderedVisibleStats();
    if (visible.length === 0) {
      const ph = document.createElement('div');
      ph.id = 'stats-placeholder';
      ph.textContent = _lastStats.length === 0
        ? 'Loading stream stats… (requires Twitch login)'
        : 'All stats hidden — use ⚙ to show them';
      wrap.appendChild(ph);
      return;
    }
    for (const s of visible) {
      const masked = settings.statsMasked.includes(s.label);
      const tile = document.createElement('div');
      tile.className = 'stat' + (masked ? ' masked' : '');
      tile.draggable = true;
      tile.dataset.label = s.label;
      tile.title = 'Click to hide/show · drag to reorder';
      const value = document.createElement('span');
      value.className = 'stat-value';
      value.textContent = masked ? '•••' : s.value;
      const label = document.createElement('span');
      label.className = 'stat-label';
      label.textContent = s.label;
      tile.append(value, label);
      tile.addEventListener('click', () => toggleStatMask(s.label));
      tile.addEventListener('dragstart', e => {
        _statsDragLabel = s.label;
        tile.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', s.label); } catch {}
      });
      tile.addEventListener('dragend', () => {
        tile.classList.remove('dragging');
        _statsDragLabel = null;
        persistStatsOrder();
      });
      wrap.appendChild(tile);
    }
  }

  function toggleStatMask(label) {
    settings.statsMasked = settings.statsMasked.includes(label)
      ? settings.statsMasked.filter(l => l !== label)
      : [...settings.statsMasked, label];
    saveSettings();
    renderStats();
  }

  // Live reorder: while dragging, slide the tile to the hovered position
  document.getElementById('stats-items').addEventListener('dragover', e => {
    if (!_statsDragLabel) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const wrap = e.currentTarget;
    const dragging = wrap.querySelector('.stat.dragging');
    if (!dragging) return;
    const after = [...wrap.querySelectorAll('.stat:not(.dragging)')]
      .find(t => e.clientX < t.getBoundingClientRect().left + t.offsetWidth / 2);
    if (after) wrap.insertBefore(dragging, after);
    else wrap.appendChild(dragging);
  });
  document.getElementById('stats-items').addEventListener('drop', e => e.preventDefault());

  function persistStatsOrder() {
    const domOrder = [...document.querySelectorAll('#stats-items .stat')].map(t => t.dataset.label);
    // keep labels that aren't currently rendered (hidden/not yet seen) behind
    const rest = settings.statsOrder.filter(l => !domOrder.includes(l));
    settings.statsOrder = [...domOrder, ...rest];
    saveSettings();
    renderStats();
  }

  function toggleStatsMenu(event) {
    event?.stopPropagation();
    const menu = document.getElementById('stats-menu');
    if (!menu.classList.contains('hidden')) { closeStatsMenu(); return; }
    // Build a checkbox row per known stat (seen live or currently hidden)
    const labels = [...new Set([..._lastStats.map(s => s.label), ...settings.statsHidden])];
    menu.replaceChildren();
    if (labels.length === 0) {
      const row = document.createElement('div');
      row.className = 'stats-menu-item';
      row.textContent = 'No stats received yet';
      menu.appendChild(row);
    }
    for (const label of labels) {
      const row = document.createElement('label');
      row.className = 'stats-menu-item';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !settings.statsHidden.includes(label);
      cb.onchange = () => {
        settings.statsHidden = cb.checked
          ? settings.statsHidden.filter(l => l !== label)
          : [...settings.statsHidden, label];
        saveSettings();
        renderStats();
      };
      row.append(cb, document.createTextNode(label));
      menu.appendChild(row);
    }
    menu.classList.remove('hidden');
    // BVs sit above the DOM — hide them while the dropdown is open
    bvHide();
  }

  function closeStatsMenu() {
    const menu = document.getElementById('stats-menu');
    if (menu.classList.contains('hidden')) return;
    menu.classList.add('hidden');
    bvShow();
  }

  document.addEventListener('click', e => {
    if (!e.target.closest('#stats-menu') && !e.target.closest('#stats-gear')) closeStatsMenu();
  });

  // ============ 7TV STATUS ============
  // The browser updates 7TV itself; this window exists so a mid-stream failure
  // is visible and repairable without guesswork — it separates "extension
  // loaded" from "extension actually rendering in chat".
  function open7TVStatus() {
    document.getElementById('seventv-modal').classList.add('show');
    document.body.classList.add('modal-open');
    refresh7TVStatus();
  }
  function close7TVStatus() {
    document.getElementById('seventv-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
  }
  function open7TVDownload() {
    window.open('https://7tv.app/', '_blank');
  }

  function render7TVStatus(s) {
    const body = document.getElementById('seventv-body');
    body.replaceChildren();
    if (!s) {
      body.innerHTML = '<div class="status-line"><span class="status-dot bad"></span><span>Status unavailable</span></div>';
      return;
    }

    const injected = (s.injection || []).reduce((n, p) => n + p.nodes, 0);
    const chatPanels = (s.injection || []).length;

    let dot = 'bad', headline = 'Not working';
    if (s.status === 'loaded' && (injected > 0 || chatPanels === 0)) {
      dot = 'ok';
      headline = chatPanels === 0
        ? `Loaded (v${s.version}) — open a Chat panel to verify`
        : `Working — 7TV v${s.version} is active in chat`;
    } else if (s.status === 'loaded') {
      dot = 'warn';
      headline = `Loaded (v${s.version}) but not rendering in chat`;
    } else if (s.status === 'not-found') {
      headline = 'No 7TV installation found';
    } else if (s.status === 'error') {
      headline = 'Failed to load';
    }

    const line = document.createElement('div');
    line.className = 'status-line';
    const d = document.createElement('span');
    d.className = 'status-dot ' + dot;
    const t = document.createElement('span');
    t.textContent = headline;
    line.append(d, t);
    body.appendChild(line);

    const rows = [];
    if (s.version) rows.push(['Version', s.version]);
    if (s.browser) rows.push(['Source', s.browser + (s.manual ? ' (manual override)' : '')]);
    if (s.manifestVersion) rows.push(['Manifest', 'V' + s.manifestVersion]);
    if (chatPanels > 0) rows.push(['Chat panels', `${(s.injection || []).filter(p => p.nodes > 0).length} of ${chatPanels} showing 7TV`]);
    if (s.available?.length > 1) rows.push(['Installs found', String(s.available.length)]);
    if (s.error) rows.push(['Error', s.error]);
    if (s.path) rows.push(['Path', s.path]);

    const dl = document.createElement('dl');
    dl.className = 'status-grid';
    for (const [k, v] of rows) {
      const dt = document.createElement('dt'); dt.textContent = k;
      const dd = document.createElement('dd'); dd.textContent = v;
      if (k === 'Path') { dd.classList.add('mono'); dd.style.cursor = 'pointer'; dd.title = 'Show in folder';
                          dd.onclick = () => window.electronAPI?.sevenTVOpenPath(); }
      dl.append(dt, dd);
    }
    body.appendChild(dl);

    const note = document.createElement('div');
    note.className = 'status-note';
    if (s.status === 'not-found') {
      note.innerHTML = '<strong>Install 7TV in Chrome, Edge, Brave, Opera or Firefox</strong>, then use Recheck &amp; Reload. This app borrows the extension from your browser — it never downloads one itself. You can also point it at an unpacked build with Choose Folder.';
    } else if (dot === 'warn') {
      note.innerHTML = '<strong>Try Recheck &amp; Reload</strong> — this re-scans for the newest build and reloads chat. If it still fails, your browser may have updated 7TV in the background; restarting the dashboard picks up the new files.';
    } else if (s.manual) {
      note.innerHTML = 'Using a manually chosen folder. <strong>Choose Folder again</strong> to change it, or clear it to go back to auto-detection.';
    } else {
      note.innerHTML = '7TV updates come from your browser. If chat emotes stop working after an update, open this window and hit <strong>Recheck &amp; Reload</strong>.';
    }
    body.appendChild(note);

    if (s.manual) {
      const clear = document.createElement('button');
      clear.className = 'preset-btn';
      clear.style.marginTop = '10px';
      clear.textContent = 'Clear manual folder (back to auto-detect)';
      clear.onclick = async () => render7TVStatus(await window.electronAPI.sevenTVClearManual());
      body.appendChild(clear);
    }
  }

  async function refresh7TVStatus() {
    if (!window.electronAPI) return render7TVStatus(null);
    try { render7TVStatus(await window.electronAPI.sevenTVStatus()); }
    catch { render7TVStatus(null); }
  }

  async function reload7TV() {
    const body = document.getElementById('seventv-body');
    body.innerHTML = '<div class="status-line"><span class="status-dot"></span><span>Reloading extension…</span></div>';
    try {
      await window.electronAPI.sevenTVReload();
      setTimeout(refresh7TVStatus, 2500); // give chat time to re-inject
    } catch { refresh7TVStatus(); }
  }

  async function pick7TVFolder() {
    try {
      const res = await window.electronAPI.sevenTVPickFolder();
      if (res?.cancelled) return;
      if (res?.error) { await showConfirm('Invalid Folder', res.error, 'OK'); return; }
      setTimeout(refresh7TVStatus, 500);
    } catch {}
  }

  // ============ NATIVE MENU SYNC ============
  function notifyMenuUpdate() {
    if (!window.electronAPI) return;
    const layouts = getSavedLayouts().map((l, i) => ({ name: l.name, index: i }));
    const closedData = closedPanels.map((p, i) => ({ title: p.title, index: i }));
    window.electronAPI.updateMenu({ layouts, closedPanels: closedData });
  }

  // ============ SHORTCUTS ============
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.shiftKey && (e.key === 'R' || e.key === 'r')) { e.preventDefault(); reloadAll(); }
    if (e.ctrlKey && e.key === 'l') { e.preventDefault(); toggleLock(); }
    if (e.ctrlKey && e.key === 'b') { e.preventDefault(); toggleStatsBar(); }
    if (e.ctrlKey && e.key === ',') { e.preventDefault(); openSettings(); }
    if (e.key === 'Escape') {
      closeAddModal(); cancelSettings(); closeEditUrlModal();
      closeSaveLayoutModal(); closeUpdateModal(); closeSetup(); closeStatsMenu();
      close7TVStatus(); resolveConfirm(false);
    }
  });

  // ============ STARTUP ============
  loadConfig();   // before loadLayout — presets are built from config
  loadSettings();
  initGrid();
  bindSettingsControls();
  loadLayout();
  applySettings();
  loadLockState();
  notifyMenuUpdate();
  applyStatsBar();

  if (window.electronAPI) {
    window.electronAPI.onUpdateStatus(showUpdateStatus);
    // Recover any state that arrived before this listener registered
    window.electronAPI.getUpdateStatus().then(p => { if (p) showUpdateStatus(p); }).catch(() => {});
    window.electronAPI.onStatsData(stats => {
      if (!statsBarActive()) return;
      _lastStats = stats;
      if (!_statsDragLabel) renderStats(); // don't rebuild tiles mid-drag
    });
    window.electronAPI.onCursorPos(handleCursorPos);
  }

  // First run on a fresh PC: collect the channel before anything can load
  if (!appConfig.channel) openSetup();
</script>
