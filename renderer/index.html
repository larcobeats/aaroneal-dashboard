<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aaroneal Stream Dashboard</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css">

<style>
  :root {
    --bg: #0e0e10;
    --panel: #18181b;
    --panel-2: #1f1f23;
    --border: #2a2a2e;
    --text: #efeff1;
    --text-dim: #adadb8;
    --accent: #aad4ff;
    --accent-glow: rgba(170, 212, 255, 0.4);
    --header-h: 24px;
    --gap: 1px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
    font-size: 11px;
  }

  /* ===== GRID ===== */
  .grid-wrapper {
    height: 100vh;
    width: 100vw;
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--bg);
    position: relative;
  }

  .grid-stack {
    background: var(--bg);
    width: 100%;
    min-height: 100%;
  }

  .grid-stack-item-content {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .grid-stack-item-content,
  .grid-stack-item-content > * {
    min-height: 0;
    min-width: 0;
  }

  /* HIDE GRIDSTACK RESIZE HANDLES */
  .grid-stack-item > .ui-resizable-handle {
    background-image: none !important;
    background: transparent !important;
  }
  .grid-stack-item > .ui-resizable-se,
  .grid-stack-item > .ui-resizable-sw,
  .grid-stack-item > .ui-resizable-ne,
  .grid-stack-item > .ui-resizable-nw {
    background-image: none !important;
    color: transparent !important;
    font-size: 0 !important;
  }
  .grid-stack-item > .ui-resizable-se::after,
  .grid-stack-item > .ui-resizable-sw::after,
  .grid-stack-item > .ui-resizable-ne::after,
  .grid-stack-item > .ui-resizable-nw::after {
    display: none !important;
  }

  /* Edge handles — wider hit area */
  .grid-stack-item > .ui-resizable-e,
  .grid-stack-item > .ui-resizable-w { width: 8px; }
  .grid-stack-item > .ui-resizable-n,
  .grid-stack-item > .ui-resizable-s { height: 8px; }

  /* Corner handles */
  .grid-stack-item > .ui-resizable-se,
  .grid-stack-item > .ui-resizable-sw,
  .grid-stack-item > .ui-resizable-ne,
  .grid-stack-item > .ui-resizable-nw {
    width: 14px;
    height: 14px;
    z-index: 10;
  }

  /* Explicit cursors for every resize direction */
  .grid-stack-item > .ui-resizable-n  { cursor: n-resize; }
  .grid-stack-item > .ui-resizable-s  { cursor: s-resize; }
  .grid-stack-item > .ui-resizable-e  { cursor: e-resize; }
  .grid-stack-item > .ui-resizable-w  { cursor: w-resize; }
  .grid-stack-item > .ui-resizable-ne { cursor: ne-resize; }
  .grid-stack-item > .ui-resizable-nw { cursor: nw-resize; }
  .grid-stack-item > .ui-resizable-se { cursor: se-resize; bottom: 0; right: 0; transition: background 0.15s ease; }
  .grid-stack-item > .ui-resizable-sw { cursor: sw-resize; }

  /* Corner/edge visual hints — only when NOT in locked mode */
  .grid-stack-item:hover > .ui-resizable-se {
    background: linear-gradient(135deg, transparent 50%, rgba(170, 212, 255, 0.25) 50%);
  }
  .grid-stack-item:hover > .ui-resizable-e {
    background: linear-gradient(to right, transparent 40%, rgba(170, 212, 255, 0.12));
  }
  .grid-stack-item:hover > .ui-resizable-s {
    background: linear-gradient(to bottom, transparent 40%, rgba(170, 212, 255, 0.12));
  }
  body.locked .grid-stack-item > .ui-resizable-handle { display: none !important; }

  /* ===== PANEL HEADER ===== */
  .panel-header {
    height: var(--header-h);
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    flex-shrink: 0;
    cursor: move;
    user-select: none;
  }

  .panel-header .title-group {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow: hidden;
  }

  .panel-header .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent-glow);
    flex-shrink: 0;
  }

  .panel-header .title-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .panel-header .actions {
    display: flex;
    gap: 3px;
    flex-shrink: 0;
  }

  .panel-header button {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-dim);
    cursor: pointer;
    padding: 1px 6px;
    font-size: 11px;
    border-radius: 2px;
    transition: all 0.1s ease;
    font-family: inherit;
    line-height: 1;
  }

  .panel-header button:hover {
    color: var(--accent);
    background: rgba(170, 212, 255, 0.1);
  }

  .panel-header button.close-btn:hover {
    color: #ff6b6b;
    background: rgba(255, 107, 107, 0.1);
  }

  /* panel-body uses flex so child webview/iframe fills via flex:1 — no
     position:absolute dependency, which was the root cause of cropping when
     the parent height was determined by flex rather than a pixel value. */
  .panel-body {
    flex: 1 1 0;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }

  .panel-body iframe,
  .panel-body webview {
    flex: 1 1 0;
    min-height: 0;
    width: 100%;
    border: 0;
    display: block;
  }

  /* ===== GRIDSTACK BEHAVIOR ===== */
  body.dragging iframe,
  body.dragging webview { pointer-events: none !important; }
  body.dragging * { user-select: none !important; }

  .grid-stack-item.ui-draggable-dragging,
  .grid-stack-item.ui-resizable-resizing {
    opacity: 0.85;
    z-index: 1000;
  }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 480px;
    max-width: 90vw;
    max-height: 85vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .modal-header {
    padding: 12px 16px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-body {
    padding: 16px;
    overflow-y: auto;
    flex: 1;
  }

  .modal-body label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    margin-bottom: 4px;
    margin-top: 14px;
  }
  .modal-body label:first-of-type { margin-top: 0; }

  .modal-body input[type="text"],
  .modal-body input[type="number"],
  .modal-body select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 3px;
    font-family: inherit;
    font-size: 11px;
  }

  .modal-body input:focus,
  .modal-body select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .modal-body input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  .range-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .range-row input[type="range"] { flex: 1; }
  .range-row .range-value {
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    min-width: 40px;
    text-align: right;
    font-size: 11px;
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    cursor: pointer;
  }
  .checkbox-row input[type="checkbox"] {
    accent-color: var(--accent);
    cursor: pointer;
  }
  .checkbox-row label {
    margin: 0;
    cursor: pointer;
    text-transform: none;
    letter-spacing: 0;
    color: var(--text);
    font-size: 11px;
  }

  .preset-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    margin-top: 6px;
  }

  .preset-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 10px;
    font-family: inherit;
    text-align: left;
    transition: all 0.15s ease;
  }

  .preset-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .modal-footer {
    padding: 12px 16px;
    background: var(--panel-2);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 6px;
  }

  .modal-footer button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }

  .modal-footer button.primary {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  .modal-footer button:hover { opacity: 0.85; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  body.locked .panel-header { cursor: default; }


  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--panel); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a3a3e; }

  .modal-body hr {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 18px 0 4px;
  }

  .modal-body .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    font-weight: 700;
    margin-top: 8px;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<!-- GRID -->
<div class="grid-wrapper" id="grid-wrapper">
  <div class="grid-stack" id="grid"></div>
</div>

<!-- ADD PANEL MODAL -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <div class="modal-header">
      <span>Add Panel</span>
      <button onclick="closeAddModal()" style="background:transparent;border:0;color:var(--text-dim);cursor:pointer;font-size:14px;">&#10005;</button>
    </div>
    <div class="modal-body">
      <label>Quick Presets</label>
      <div class="preset-grid">
        <button class="preset-btn" onclick="addPresetPanel('quick-actions')">&#9889; Quick Actions</button>
        <button class="preset-btn" onclick="addPresetPanel('activity-feed')">&#128202; Activity Feed</button>
        <button class="preset-btn" onclick="addPresetPanel('chat')">&#128172; Chat (Twitch+7TV)</button>
        <button class="preset-btn" onclick="addPresetPanel('stream')">&#128250; Live Preview</button>
        <button class="preset-btn" onclick="addPresetPanel('tikfinity-chat')">&#127925; TikTok Chat</button>
        <button class="preset-btn" onclick="addPresetPanel('tikfinity-views')">&#128065; TikTok Views</button>
        <button class="preset-btn" onclick="addPresetPanel('predictions')">&#127919; Predictions</button>
        <button class="preset-btn" onclick="addPresetPanel('sub-goal')">&#127873; Sub Goal</button>
        <button class="preset-btn" onclick="addPresetPanel('stream-manager')">&#127897;&#65039; Stream Manager</button>
      </div>

      <label style="margin-top:20px;">Custom URL Panel</label>
      <input type="text" id="custom-name" placeholder="Panel name (e.g. My Custom Widget)">
      <input type="text" id="custom-url" placeholder="https://..." style="margin-top:6px;">
    </div>
    <div class="modal-footer">
      <button onclick="closeAddModal()">Cancel</button>
      <button class="primary" onclick="addCustomPanel()">Add Custom</button>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <div class="modal-header">
      <span>Settings</span>
      <button onclick="cancelSettings()" style="background:transparent;border:0;color:var(--text-dim);cursor:pointer;font-size:14px;">&#10005;</button>
    </div>
    <div class="modal-body">

      <div class="section-title">Layout</div>

      <label>Grid Columns (more = finer horizontal snap)</label>
      <div class="range-row">
        <input type="range" id="setting-columns" min="12" max="240" step="6">
        <span class="range-value" id="setting-columns-val">12</span>
      </div>

      <label>Grid Rows (more = finer vertical snap)</label>
      <div class="range-row">
        <input type="range" id="setting-rows" min="6" max="240" step="2">
        <span class="range-value" id="setting-rows-val">12</span>
      </div>

      <label>Panel Gap (pixels)</label>
      <div class="range-row">
        <input type="range" id="setting-gap" min="0" max="12" step="1">
        <span class="range-value" id="setting-gap-val">1</span>
      </div>

      <hr>
      <div class="section-title">Behavior</div>

      <div class="checkbox-row">
        <input type="checkbox" id="setting-float">
        <label for="setting-float">Float (panels can be placed anywhere, won't auto-stack)</label>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="setting-animate">
        <label for="setting-animate">Animate panel movements</label>
      </div>

      <hr>
      <div class="section-title">Reset</div>
      <button class="preset-btn" style="text-align:center; width:100%;" onclick="resetSettings()">Reset settings to defaults</button>

    </div>
    <div class="modal-footer">
      <button onclick="cancelSettings()">Cancel</button>
      <button class="primary" onclick="closeSettings()">Done</button>
    </div>
  </div>
</div>

<!-- UPDATE STATUS MODAL -->
<div class="modal-overlay" id="update-modal">
  <div class="modal" style="width:420px;">
    <div class="modal-header">
      <span id="update-modal-title">Updates</span>
      <button onclick="closeUpdateModal()" style="background:transparent;border:0;color:var(--text-dim);cursor:pointer;font-size:14px;">&#10005;</button>
    </div>
    <div class="modal-body" id="update-modal-body" style="padding:24px 16px;text-align:center;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;">
    </div>
    <div class="modal-footer" id="update-modal-footer" style="justify-content:center;"></div>
  </div>
</div>

<!-- SAVE LAYOUT MODAL -->
<div class="modal-overlay" id="save-layout-modal">
  <div class="modal" style="width:400px;">
    <div class="modal-header">
      <span>Save Current Layout</span>
      <button onclick="closeSaveLayoutModal()" style="background:transparent;border:0;color:var(--text-dim);cursor:pointer;font-size:14px;">&#10005;</button>
    </div>
    <div class="modal-body">
      <label>Layout Name</label>
      <input type="text" id="save-layout-name" placeholder="e.g. Stream Setup, Gaming View…"
             onkeydown="if(event.key==='Enter') confirmSaveLayout()">
    </div>
    <div class="modal-footer">
      <button onclick="closeSaveLayoutModal()">Cancel</button>
      <button class="primary" onclick="confirmSaveLayout()">Save</button>
    </div>
  </div>
</div>

<!-- EDIT URL MODAL -->
<div class="modal-overlay" id="edit-url-modal">
  <div class="modal" style="width:520px;">
    <div class="modal-header">
      <span>Edit Panel URL</span>
      <button onclick="closeEditUrlModal()" style="background:transparent;border:0;color:var(--text-dim);cursor:pointer;font-size:14px;">&#10005;</button>
    </div>
    <div class="modal-body">
      <label>URL</label>
      <input type="text" id="edit-url-input" placeholder="https://…"
             onkeydown="if(event.key==='Enter') confirmEditUrl()">
    </div>
    <div class="modal-footer">
      <button onclick="closeEditUrlModal()">Cancel</button>
      <button class="primary" onclick="confirmEditUrl()">Update Panel</button>
    </div>
  </div>
</div>

<!-- GENERIC CONFIRM MODAL -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal" style="width:400px;">
    <div class="modal-header">
      <span id="confirm-modal-title">Confirm</span>
    </div>
    <div class="modal-body" id="confirm-modal-body" style="padding:20px 16px;"></div>
    <div class="modal-footer">
      <button onclick="resolveConfirm(false)">Cancel</button>
      <button class="primary" id="confirm-modal-ok" onclick="resolveConfirm(true)">OK</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js"></script>

<script>
  // ============ CONFIG ============
  const CHANNEL = 'aaroneal';

  const PRESETS = {
    'quick-actions': {
      title: 'Quick Actions',
      url: `https://dashboard.twitch.tv/popout/u/${CHANNEL}/stream-manager/quick-actions?uuid=f878d6215f2ff9c30de41b3cbdf4f7f6`,
      w: 4, h: 6
    },
    'activity-feed': {
      title: 'Activity Feed',
      url: `https://streamelements.com/dashboard/6214670f53678f6f0d07d53d/activity/popout`,
      w: 4, h: 6,
      type: 'webview'  // webview so OAuth postMessage callback works (window.opener chain intact)
    },
    'chat': {
      title: 'Chat',
      url: `https://www.twitch.tv/popout/${CHANNEL}/chat?popout=`,
      w: 4, h: 12,
      type: 'webview'  // rendered as <webview> so 7TV extension can inject
    },
    'stream': {
      title: 'Live Preview',
      url: `https://player.twitch.tv/?channel=${CHANNEL}&parent=localhost&muted=true&autoplay=true`,
      w: 8, h: 6,
      type: 'stream'
    },
    'tikfinity-chat': {
      title: 'TikTok Chat',
      url: `https://tikfinity.zerody.one/widget/activity-feed?cid=30451&did=1`,
      w: 4, h: 6
    },
    'tikfinity-views': {
      title: 'TikTok Views',
      url: `https://tikfinity.zerody.one/widget/viewercount?cid=30451`,
      w: 2, h: 2
    },
    'predictions': {
      title: 'Predictions',
      url: `https://www.twitch.tv/popout/${CHANNEL}/predictions/summary`,
      w: 4, h: 6
    },
    'sub-goal': {
      title: 'Sub Goal',
      url: `https://streamelements.com/overlay/655ea9ee118dc33c8fadd6d2/editor?er=1`,
      w: 4, h: 3
    },
    'stream-manager': {
      title: 'Stream Manager',
      url: `https://dashboard.twitch.tv/u/${CHANNEL}/stream-manager`,
      w: 6, h: 9
    }
  };

  const DEFAULT_LAYOUT = [
    { id: 'p-quick-actions-default', preset: 'quick-actions', x: 0, y: 0,  w: 4, h: 6 },
    { id: 'p-activity-feed-default', preset: 'activity-feed', x: 4, y: 0,  w: 4, h: 6 },
    { id: 'p-chat-default',          preset: 'chat',          x: 8, y: 0,  w: 4, h: 12 },
    { id: 'p-stream-default',        preset: 'stream',        x: 0, y: 6,  w: 8, h: 6 }
  ];

  const DEFAULT_SETTINGS = {
    columns: 12,
    rows: 12,
    gap: 1,
    float: true,
    animate: false  // animations during drag cause visible lag; off by default
  };

  // ============ STATE ============
  let grid;
  let panels = {};
  let closedPanels = [];
  let isLocked = false;
  let settings = { ...DEFAULT_SETTINGS };

  // ============ SETTINGS ============
  function loadSettings() {
    const saved = localStorage.getItem('dashboard-settings');
    if (saved) {
      try { settings = { ...DEFAULT_SETTINGS, ...JSON.parse(saved) }; }
      catch { settings = { ...DEFAULT_SETTINGS }; }
    }
    applySettings();
  }

  function saveSettings() {
    localStorage.setItem('dashboard-settings', JSON.stringify(settings));
  }

  function applySettings() {
    document.documentElement.style.setProperty('--gap', settings.gap + 'px');

    if (grid) {
      grid.cellHeight(calculateCellHeight());
      grid.float(settings.float);
      grid.opts.animate = settings.animate;
      grid.margin(settings.gap);
    }
  }

  let pendingSettings = null;

  function openSettings() {
    pendingSettings = { ...settings };

    document.getElementById('setting-columns').value = settings.columns;
    document.getElementById('setting-columns-val').textContent = settings.columns;
    document.getElementById('setting-rows').value = settings.rows;
    document.getElementById('setting-rows-val').textContent = settings.rows;
    document.getElementById('setting-gap').value = settings.gap;
    document.getElementById('setting-gap-val').textContent = settings.gap;
    document.getElementById('setting-float').checked = settings.float;
    document.getElementById('setting-animate').checked = settings.animate;

    document.getElementById('settings-modal').classList.add('show');
    document.body.classList.add('modal-open');
  }

  function closeSettings() {
    if (!pendingSettings) {
      document.getElementById('settings-modal').classList.remove('show');
      document.body.classList.remove('modal-open');
      return;
    }

    const colsChanged = pendingSettings.columns !== settings.columns;
    const rowsChanged = pendingSettings.rows !== settings.rows;
    const needsReload = colsChanged || rowsChanged;

    // Flush current positions before scaling so we scale the live state
    saveLayout();
    if (colsChanged) scaleLayoutColumns(settings.columns, pendingSettings.columns);
    if (rowsChanged) scaleLayoutRows(settings.rows, pendingSettings.rows);

    settings = { ...pendingSettings };
    pendingSettings = null;
    saveSettings();

    document.getElementById('settings-modal').classList.remove('show');
    document.body.classList.remove('modal-open');

    if (needsReload) {
      location.reload();
    } else {
      applySettings();
    }
  }

  function cancelSettings() {
    pendingSettings = null;
    document.getElementById('settings-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
  }

  function bindSettingsControls() {
    document.getElementById('setting-columns').addEventListener('input', e => {
      const v = parseInt(e.target.value);
      if (pendingSettings) pendingSettings.columns = v;
      document.getElementById('setting-columns-val').textContent = v;
    });

    document.getElementById('setting-rows').addEventListener('input', e => {
      const v = parseInt(e.target.value);
      if (pendingSettings) pendingSettings.rows = v;
      document.getElementById('setting-rows-val').textContent = v;
    });

    document.getElementById('setting-gap').addEventListener('input', e => {
      const v = parseInt(e.target.value);
      if (pendingSettings) pendingSettings.gap = v;
      document.getElementById('setting-gap-val').textContent = v;
      document.documentElement.style.setProperty('--gap', v + 'px');
      if (grid) {
        grid.margin(v);
        grid.cellHeight(calculateCellHeightForRows(pendingSettings.rows, v));
      }
    });

    document.getElementById('setting-float').addEventListener('change', e => {
      if (pendingSettings) pendingSettings.float = e.target.checked;
      if (grid) grid.float(e.target.checked);
    });

    document.getElementById('setting-animate').addEventListener('change', e => {
      if (pendingSettings) pendingSettings.animate = e.target.checked;
      if (grid) grid.opts.animate = e.target.checked;
    });
  }

  async function resetSettings() {
    const ok = await showConfirm('Reset Settings',
      'Reset all settings to defaults? Panel positions are kept.', 'Reset');
    if (!ok) return;
    settings = { ...DEFAULT_SETTINGS };
    saveSettings();
    location.reload();
  }

  function scaleLayoutColumns(oldCols, newCols) {
    const saved = localStorage.getItem('dashboard-layout');
    if (!saved) return;
    try {
      const nodes = JSON.parse(saved);
      const ratio = newCols / oldCols;
      const scaled = nodes.map(n => ({
        ...n,
        x: Math.round(n.x * ratio),
        w: Math.max(1, Math.round(n.w * ratio))
      }));
      scaled.forEach(n => {
        if (n.x + n.w > newCols) n.w = newCols - n.x;
        if (n.w < 1) { n.x = 0; n.w = Math.min(newCols, 4); }
      });
      localStorage.setItem('dashboard-layout', JSON.stringify(scaled));
    } catch (e) { console.warn('scaleLayoutColumns failed', e); }
  }

  function scaleLayoutRows(oldRows, newRows) {
    const saved = localStorage.getItem('dashboard-layout');
    if (!saved) return;
    try {
      const nodes = JSON.parse(saved);
      const ratio = newRows / oldRows;
      const scaled = nodes.map(n => ({
        ...n,
        y: Math.round(n.y * ratio),
        h: Math.max(1, Math.round(n.h * ratio))
      }));
      localStorage.setItem('dashboard-layout', JSON.stringify(scaled));
    } catch (e) { console.warn('scaleLayoutRows failed', e); }
  }

  // ============ INIT ============
  function calculateCellHeight() {
    return calculateCellHeightForRows(settings.rows, settings.gap);
  }

  function calculateCellHeightForRows(rows, gap) {
    const totalGap = gap * (rows + 1);
    const available = window.innerHeight - totalGap;
    return Math.max(8, Math.floor(available / rows));
  }

  function injectColumnCSS(columnCount) {
    const styleId = 'gridstack-custom-columns';
    let style = document.getElementById(styleId);
    if (!style) {
      style = document.createElement('style');
      style.id = styleId;
      document.head.appendChild(style);
    }

    let css = '';
    const pct = 100 / columnCount;
    for (let i = 0; i <= columnCount; i++) {
      css += `.grid-stack > .grid-stack-item[gs-w="${i}"] { width: ${pct * i}%; }\n`;
      css += `.grid-stack > .grid-stack-item[gs-x="${i}"] { left: ${pct * i}%; }\n`;
      css += `.grid-stack > .grid-stack-item[gs-min-w="${i}"] { min-width: ${pct * i}%; }\n`;
      css += `.grid-stack > .grid-stack-item[gs-max-w="${i}"] { max-width: ${pct * i}%; }\n`;
    }
    style.textContent = css;
  }

  function initGrid() {
    injectColumnCSS(settings.columns);

    grid = GridStack.init({
      column: settings.columns,
      cellHeight: calculateCellHeight(),
      margin: settings.gap,
      float: settings.float,
      animate: settings.animate,
      resizable: { handles: 'all' },
      draggable: { handle: '.panel-header' },
      disableOneColumnMode: true
    });

    grid.on('dragstart', () => document.body.classList.add('dragging'));
    grid.on('dragstop',  () => { document.body.classList.remove('dragging'); saveLayout(); });

    setupResizeHandlers();

    grid.on('change',          saveLayout);
    grid.on('added removed',   saveLayout);

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (grid) grid.cellHeight(calculateCellHeight());
      }, 150);
    });
  }

  // ============ RESIZE EVENTS ============
  // Simplified: GridStack handles its own collision/float logic.
  // We only need to hook resizestart/resizestop for pointer-events and
  // the webview repaint fix.
  //
  // Root cause of the old "tiling resize" code: it tried to mirror adjacent
  // panel resizes, but the logic was brittle — a single off-by-one in grid
  // units would cause panels to jump or disappear.  Removed entirely.
  // Users can resize panels independently; GridStack's built-in float mode
  // lets them overlap or snap as needed without forced coupling.

  function setupResizeHandlers() {
    grid.on('resizestart', () => document.body.classList.add('dragging'));
    grid.on('resizestop',  () => { document.body.classList.remove('dragging'); saveLayout(); });
  }
  // Note: the previous ResizeObserver width-nudge approach was removed.
  // Root cause of cropping was position:absolute on webview inside a flex
  // parent — fixed by switching panel-body to display:flex so the child
  // fills via flex:1 rather than inset:0.  No JS repaint hack needed.

  // ============ PANEL HTML ============
  function buildPanelHTML(id, config) {
    const { title, url, type } = config;

    // <webview> for chat — gives 7TV extension a top-level Chromium context to inject into
    if (type === 'webview') {
      return `
        <div class="panel-header">
          <div class="title-group">
            <span class="dot"></span>
            <span class="title-text">${escapeHtml(title)}</span>
          </div>
          <div class="actions">
            <button onclick="editPanelUrl('${id}')" title="Edit URL">&#9998;</button>
            <button onclick="reloadPanel('${id}')" title="Reload">&#8635;</button>
            <button class="close-btn" onclick="closePanel('${id}')" title="Close">&#10005;</button>
          </div>
        </div>
        <div class="panel-body">
          <webview src="${escapeHtml(url)}" allowpopups></webview>
        </div>
      `;
    }

    if (type === 'stream') {
      return `
        <div class="panel-header">
          <div class="title-group">
            <span class="dot"></span>
            <span class="title-text">${escapeHtml(title)}</span>
          </div>
          <div class="actions">
            <button onclick="toggleStreamMute('${id}')" title="Toggle mute"><span class="mute-icon">&#128263;</span></button>
            <button onclick="editPanelUrl('${id}')" title="Edit URL">&#9998;</button>
            <button onclick="reloadPanel('${id}')" title="Reload">&#8635;</button>
            <button class="close-btn" onclick="closePanel('${id}')" title="Close">&#10005;</button>
          </div>
        </div>
        <div class="panel-body">
          <iframe src="${escapeHtml(url)}" frameborder="0" scrolling="no" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
        </div>
      `;
    }

    return `
      <div class="panel-header">
        <div class="title-group">
          <span class="dot"></span>
          <span class="title-text">${escapeHtml(title)}</span>
        </div>
        <div class="actions">
          <button onclick="editPanelUrl('${id}')" title="Edit URL">&#9998;</button>
          <button onclick="reloadPanel('${id}')" title="Reload">&#8635;</button>
          <button class="close-btn" onclick="closePanel('${id}')" title="Close">&#10005;</button>
        </div>
      </div>
      <div class="panel-body">
        <iframe src="${escapeHtml(url)}" allow="clipboard-read; clipboard-write"></iframe>
      </div>
    `;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ============ CRUD ============
  function addPanel(id, config, gridOpts = {}) {
    const w = gridOpts.w || config.w || 8;
    const h = gridOpts.h || config.h || 12;
    const x = gridOpts.x;
    const y = gridOpts.y;

    const widget = {
      id,
      w, h,
      ...(x !== undefined ? { x } : {}),
      ...(y !== undefined ? { y } : {}),
      content: `<div class="grid-stack-item-content" id="content-${id}">${buildPanelHTML(id, config)}</div>`
    };

    grid.addWidget(widget);
    panels[id] = config;
    saveLayout();
  }

  function closePanel(id) {
    const config = panels[id];
    if (!config) return;
    const node = grid.engine.nodes.find(n => n.id === id);
    if (!node) return;

    closedPanels.push({ ...config, w: node.w, h: node.h });
    grid.removeWidget(node.el, true);
    delete panels[id];
    saveLayout();
    saveClosedPanels();
    notifyMenuUpdate();
  }

  function reopenPanel(idx) {
    const config = closedPanels.splice(idx, 1)[0];
    if (!config) return;
    const newId = `p-${config.preset || 'custom'}-${Date.now()}`;
    addPanel(newId, config, { w: config.w, h: config.h });
    saveClosedPanels();
    notifyMenuUpdate();
  }

  // ============ DIALOGS ============
  function addPanelDialog() {
    document.getElementById('add-modal').classList.add('show');
    document.body.classList.add('modal-open');
  }
  function closeAddModal() {
    document.getElementById('add-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
    document.getElementById('custom-name').value = '';
    document.getElementById('custom-url').value = '';
  }
  function addPresetPanel(presetKey) {
    const preset = PRESETS[presetKey];
    if (!preset) return;
    const id = `p-${presetKey}-${Date.now()}`;
    addPanel(id, { ...preset, preset: presetKey });
    closeAddModal();
  }
  function addCustomPanel() {
    const name = document.getElementById('custom-name').value.trim();
    const url = document.getElementById('custom-url').value.trim();
    if (!name || !url) { alert('Please provide both a name and a URL.'); return; }
    const id = `p-custom-${Date.now()}`;
    addPanel(id, { title: name, url, w: 8, h: 12 });
    closeAddModal();
  }

  // ============ SAVED LAYOUTS ============
  function getSavedLayouts() {
    try { return JSON.parse(localStorage.getItem('dashboard-saved-layouts') || '[]'); }
    catch { return []; }
  }
  function setSavedLayouts(layouts) {
    localStorage.setItem('dashboard-saved-layouts', JSON.stringify(layouts));
  }
  function captureCurrentLayout() {
    if (!grid) return null;
    const nodes = grid.engine.nodes.map(n => ({
      id: n.id, x: n.x, y: n.y, w: n.w, h: n.h, config: panels[n.id]
    })).filter(n => n.config);
    return { panels: nodes, columns: settings.columns, rows: settings.rows, gap: settings.gap, savedAt: Date.now() };
  }
  function saveCurrentAsLayout() {
    // Open modal instead of prompt() — prompt() silently fails when called
    // via executeJavaScript() from the native menu in Electron 29.
    document.getElementById('save-layout-name').value = '';
    document.getElementById('save-layout-modal').classList.add('show');
    document.body.classList.add('modal-open');
    setTimeout(() => document.getElementById('save-layout-name').focus(), 50);
  }
  function closeSaveLayoutModal() {
    document.getElementById('save-layout-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
  }
  async function confirmSaveLayout() {
    const name = document.getElementById('save-layout-name').value.trim();
    if (!name) return;
    closeSaveLayoutModal();
    const layouts = getSavedLayouts();
    const existingIdx = layouts.findIndex(l => l.name === name);
    if (existingIdx >= 0) {
      const ok = await showConfirm('Overwrite Layout',
        `A layout named "${name}" already exists. Overwrite it?`, 'Overwrite');
      if (!ok) return;
      layouts.splice(existingIdx, 1);
    }
    const captured = captureCurrentLayout();
    if (!captured) return;
    layouts.push({ name, ...captured });
    setSavedLayouts(layouts);
    notifyMenuUpdate();
  }
  async function loadSavedLayout(idx) {
    const layouts = getSavedLayouts();
    const layout = layouts[idx];
    if (!layout) return;
    const ok = await showConfirm('Load Layout',
      `Load "${layout.name}"? Your current panel positions will be replaced.`, 'Load');
    if (!ok) return;
    const newSettings = { ...settings, columns: layout.columns, rows: layout.rows,
      gap: layout.gap !== undefined ? layout.gap : settings.gap };
    localStorage.setItem('dashboard-settings', JSON.stringify(newSettings));
    localStorage.setItem('dashboard-layout', JSON.stringify(layout.panels));
    localStorage.setItem('dashboard-version', String(LAYOUT_VERSION));
    location.reload();
  }
  async function deleteSavedLayout(idx, event) {
    if (event) event.stopPropagation();
    const layouts = getSavedLayouts();
    const layout = layouts[idx];
    if (!layout) return;
    const ok = await showConfirm('Delete Layout', `Delete "${layout.name}"?`, 'Delete');
    if (!ok) return;
    layouts.splice(idx, 1);
    setSavedLayouts(layouts);
    notifyMenuUpdate();
  }
  // ============ PANEL ACTIONS ============
  function reloadPanel(id) {
    const content = document.getElementById(`content-${id}`);
    if (!content) return;
    content.querySelectorAll('iframe').forEach(f => { f.src = f.src; });
    content.querySelectorAll('webview').forEach(wv => wv.reload());
  }

  function toggleStreamMute(id) {
    const content = document.getElementById(`content-${id}`);
    if (!content) return;
    const iframe = content.querySelector('iframe');
    const muteIcon = content.querySelector('.mute-icon');
    const url = new URL(iframe.src);
    const isMuted = url.searchParams.get('muted') === 'true';
    url.searchParams.set('muted', !isMuted);
    iframe.src = url.toString();
    muteIcon.textContent = isMuted ? '&#128266;' : '&#128263;';
  }

  let _editingPanelId = null;
  function editPanelUrl(id) {
    const config = panels[id];
    if (!config) return;
    _editingPanelId = id;
    document.getElementById('edit-url-input').value = config.url;
    document.getElementById('edit-url-modal').classList.add('show');
    document.body.classList.add('modal-open');
    setTimeout(() => {
      const inp = document.getElementById('edit-url-input');
      inp.focus(); inp.select();
    }, 50);
  }
  function closeEditUrlModal() {
    _editingPanelId = null;
    document.getElementById('edit-url-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
  }
  function confirmEditUrl() {
    const raw = document.getElementById('edit-url-input').value.trim();
    if (!raw) return;
    // Basic URL validation
    try { new URL(raw); } catch { alert('Please enter a valid URL starting with https://'); return; }
    closeEditUrlModal();
    const id = _editingPanelId;
    if (!id || !panels[id]) return;
    panels[id].url = raw;
    const content = document.getElementById(`content-${id}`);
    if (content) {
      content.querySelectorAll('iframe').forEach(f  => { f.src = raw; });
      content.querySelectorAll('webview').forEach(wv => { wv.src = raw; });
    }
    saveLayout();
  }

  function reloadAll() {
    document.querySelectorAll('.grid-stack iframe').forEach(f => { f.src = f.src; });
    document.querySelectorAll('.grid-stack webview').forEach(wv => wv.reload());
  }

  function toggleLock() {
    isLocked = !isLocked;
    document.body.classList.toggle('locked', isLocked);
    // Update all panels' move/resize constraints
    grid.engine.nodes.forEach(node => {
      grid.update(node.el, { noMove: isLocked, noResize: isLocked, locked: isLocked });
    });
  }

  async function resetLayout() {
    const ok = await showConfirm('Reset Layout',
      'Reset to the default layout? Custom panels will be removed and positions cleared.', 'Reset');
    if (!ok) return;
    localStorage.removeItem('dashboard-layout');
    localStorage.removeItem('dashboard-closed');
    localStorage.removeItem('dashboard-version');
    const newSettings = { ...settings, columns: DEFAULT_SETTINGS.columns, rows: DEFAULT_SETTINGS.rows };
    localStorage.setItem('dashboard-settings', JSON.stringify(newSettings));
    location.reload();
  }

  // ============ PERSISTENCE ============
  const LAYOUT_VERSION = 2;

  function saveLayout() {
    if (!grid) return;
    const nodes = grid.engine.nodes.map(n => ({
      id: n.id, x: n.x, y: n.y, w: n.w, h: n.h, config: panels[n.id]
    })).filter(n => n.config);
    localStorage.setItem('dashboard-layout', JSON.stringify(nodes));
    localStorage.setItem('dashboard-version', String(LAYOUT_VERSION));
  }

  function saveClosedPanels() {
    localStorage.setItem('dashboard-closed', JSON.stringify(closedPanels));
  }

  function loadLayout() {
    const saved = localStorage.getItem('dashboard-layout');
    const closedSaved = localStorage.getItem('dashboard-closed');
    const savedVersion = parseInt(localStorage.getItem('dashboard-version') || '1');

    if (closedSaved) {
      try { closedPanels = JSON.parse(closedSaved) || []; } catch {}
    }

    if (saved && savedVersion === LAYOUT_VERSION) {
      try {
        const nodes = JSON.parse(saved);
        if (nodes.length > 0) {
          // Clamp panels that exceed the current column count rather than
          // discarding the whole layout (previous behaviour wiped everything
          // if even a single panel was slightly out of bounds).
          const usable = nodes.filter(n => n.config && n.w > 0 && n.h > 0).map(n => {
            const node = { ...n };
            if (node.x < 0) node.x = 0;
            if (node.y < 0) node.y = 0;
            if (node.x + node.w > settings.columns) {
              node.w = settings.columns - node.x;
              if (node.w < 1) { node.x = 0; node.w = Math.min(settings.columns, 4); }
            }
            // Always refresh URL + type from current PRESETS so stale saved
            // values (e.g. old iframe for activity-feed) are never re-used.
            if (node.config.preset && PRESETS[node.config.preset]) {
              const fresh = PRESETS[node.config.preset];
              node.config.url  = fresh.url;
              node.config.type = fresh.type;
            }
            return node;
          });
          if (usable.length > 0) {
            usable.forEach(n => addPanel(n.id, n.config, { x: n.x, y: n.y, w: n.w, h: n.h }));
            return;
          }
        }
      } catch (e) { console.warn('Failed to load layout', e); }
    }

    localStorage.setItem('dashboard-version', String(LAYOUT_VERSION));
    const colRatio = settings.columns / 12;
    const rowRatio = settings.rows / 12;

    DEFAULT_LAYOUT.forEach(item => {
      const config = { ...PRESETS[item.preset], preset: item.preset };
      addPanel(item.id, config, {
        x: Math.round(item.x * colRatio),
        y: Math.round(item.y * rowRatio),
        w: Math.max(1, Math.round(item.w * colRatio)),
        h: Math.max(1, Math.round(item.h * rowRatio))
      });
    });
  }

  // ============ CONFIRM MODAL ============
  // Replaces window.confirm() throughout — confirm() silently returns false
  // when called via executeJavaScript() from the native menu in Electron 29.
  let _confirmResolve = null;
  function showConfirm(title, message, okLabel = 'OK') {
    return new Promise(resolve => {
      _confirmResolve = resolve;
      document.getElementById('confirm-modal-title').textContent = title;
      document.getElementById('confirm-modal-body').textContent = message;
      document.getElementById('confirm-modal-ok').textContent = okLabel;
      document.getElementById('confirm-modal').classList.add('show');
      document.body.classList.add('modal-open');
    });
  }
  function resolveConfirm(result) {
    document.getElementById('confirm-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
    if (_confirmResolve) { _confirmResolve(result); _confirmResolve = null; }
  }

  // ============ UPDATE MODAL ============
  function closeUpdateModal() {
    document.getElementById('update-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
  }
  function showUpdateStatus(payload) {
    const modal  = document.getElementById('update-modal');
    const body   = document.getElementById('update-modal-body');
    const footer = document.getElementById('update-modal-footer');
    const title  = document.getElementById('update-modal-title');

    modal.classList.add('show');
    document.body.classList.add('modal-open');
    footer.innerHTML = '';

    switch (payload.state) {
      case 'checking':
        title.textContent = 'Checking for Updates';
        body.innerHTML = '<span style="color:var(--text-dim)">Checking GitHub releases…</span>';
        break;
      case 'available':
        title.textContent = 'Update Available';
        body.innerHTML = `<span>Version <strong style="color:var(--accent)">${payload.version}</strong> is available.</span>
          <span style="color:var(--text-dim);font-size:10px;">The update will download automatically in the background.</span>`;
        break;
      case 'not-available':
        title.textContent = 'Up to Date';
        body.innerHTML = `<span>You're running the latest version.</span>
          <span style="color:var(--text-dim);font-size:10px;">(${payload.version})</span>`;
        footer.innerHTML = `<button class="primary" onclick="closeUpdateModal()">Close</button>`;
        break;
      case 'downloading': {
        const pct = payload.percent || 0;
        title.textContent = 'Downloading Update';
        body.innerHTML = `
          <span>Downloading… ${pct}%</span>
          <div style="width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px;">
            <div style="width:${pct}%;height:100%;background:var(--accent);transition:width 0.3s ease;"></div>
          </div>`;
        break;
      }
      case 'ready':
        title.textContent = 'Ready to Install';
        body.innerHTML = `<span>Version <strong style="color:var(--accent)">${payload.version}</strong> has been downloaded.</span>
          <span style="color:var(--text-dim);font-size:10px;">The app will restart to apply the update.</span>`;
        footer.innerHTML = `
          <button onclick="closeUpdateModal()">Later</button>
          <button class="primary" onclick="window.electronAPI.installUpdate()">Restart &amp; Install</button>`;
        break;
      case 'error':
        title.textContent = 'Update Error';
        body.innerHTML = `<span style="color:#ff6b6b">Update check failed.</span>
          <span style="color:var(--text-dim);font-size:10px;word-break:break-all;">${payload.message || 'Unknown error'}</span>`;
        footer.innerHTML = `<button class="primary" onclick="closeUpdateModal()">Close</button>`;
        break;
    }
  }

  // ============ NATIVE MENU SYNC ============
  // Sends current layouts + closed-panels state to main process so it can
  // rebuild the native Layouts and "Reopen Closed Panel" menus dynamically.
  function notifyMenuUpdate() {
    if (!window.electronAPI) return;
    const layouts = getSavedLayouts().map((l, i) => ({ name: l.name, index: i }));
    const closedData = closedPanels.map((p, i) => ({ title: p.title, index: i }));
    window.electronAPI.updateMenu({ layouts, closedPanels: closedData });
  }

  // ============ SHORTCUTS ============
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.shiftKey && (e.key === 'R' || e.key === 'r')) { e.preventDefault(); reloadAll(); }
    if (e.ctrlKey && e.key === 'l') { e.preventDefault(); toggleLock(); }
    if (e.ctrlKey && e.key === ',') { e.preventDefault(); openSettings(); }
    if (e.key === 'Escape') {
      closeAddModal(); cancelSettings(); closeEditUrlModal();
      closeSaveLayoutModal(); closeUpdateModal();
      resolveConfirm(false);
    }
  });

  // ============ STARTUP ============
  loadSettings();
  initGrid();
  bindSettingsControls();
  loadLayout();
  applySettings();
  notifyMenuUpdate();

  // Wire update events from main process → update modal
  if (window.electronAPI) {
    window.electronAPI.onUpdateStatus(showUpdateStatus);
  }
</script>

</body>
</html>
