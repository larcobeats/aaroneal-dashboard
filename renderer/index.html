<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aaroneal Stream Dashboard</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css">

<style>
  :root {
    --bg:           #0c0c0f;
    --surface:      #111116;
    --panel:        #141418;
    --panel-2:      #1b1b22;
    --panel-hover:  #20202a;
    --border:       #2a2a36;
    --border-sub:   #1e1e28;
    --text:         #eeeef4;
    --text-dim:     #8888a0;
    --text-muted:   #50505f;
    --accent:       #7b8cff;
    --accent-dim:   rgba(123, 140, 255, 0.14);
    --accent-glow:  rgba(123, 140, 255, 0.3);
    --danger:       #ff5264;
    --danger-dim:   rgba(255, 82, 100, 0.12);
    --header-h:     22px;
    --gap:          0px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
    font-size: 12px;
  }

  /* ===== GRID ===== */
  .grid-wrapper {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    background: var(--bg);
    position: relative;
  }

  .grid-stack {
    background: var(--bg);
    width: 100%;
    min-height: 100%;
  }

  .grid-stack-item-content {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transition: border-color 0.2s ease, border-radius 0.2s ease;
  }

  /* Locked: borderless seamless tiles */
  body.locked .grid-stack-item-content {
    border-color: transparent;
    border-radius: 0;
  }
  body.locked .panel-header {
    border-bottom-color: transparent;
  }

  .grid-stack-item-content,
  .grid-stack-item-content > * {
    min-height: 0;
    min-width: 0;
  }

  .grid-stack-item:hover > .grid-stack-item-content {
    border-color: #38384a;
  }

  /* ===== RESIZE HANDLES ===== */
  .grid-stack-item > .ui-resizable-handle {
    background-image: none !important;
    background: transparent !important;
  }
  .grid-stack-item > .ui-resizable-se,
  .grid-stack-item > .ui-resizable-sw,
  .grid-stack-item > .ui-resizable-ne,
  .grid-stack-item > .ui-resizable-nw {
    background-image: none !important;
    color: transparent !important;
    font-size: 0 !important;
  }
  .grid-stack-item > .ui-resizable-se::after,
  .grid-stack-item > .ui-resizable-sw::after,
  .grid-stack-item > .ui-resizable-ne::after,
  .grid-stack-item > .ui-resizable-nw::after { display: none !important; }

  .grid-stack-item > .ui-resizable-e,
  .grid-stack-item > .ui-resizable-w { width: 8px; }
  .grid-stack-item > .ui-resizable-n,
  .grid-stack-item > .ui-resizable-s { height: 8px; }

  .grid-stack-item > .ui-resizable-se,
  .grid-stack-item > .ui-resizable-sw,
  .grid-stack-item > .ui-resizable-ne,
  .grid-stack-item > .ui-resizable-nw { width: 14px; height: 14px; z-index: 10; }

  .grid-stack-item > .ui-resizable-n  { cursor: n-resize; }
  .grid-stack-item > .ui-resizable-s  { cursor: s-resize; }
  .grid-stack-item > .ui-resizable-e  { cursor: e-resize; }
  .grid-stack-item > .ui-resizable-w  { cursor: w-resize; }
  .grid-stack-item > .ui-resizable-ne { cursor: ne-resize; }
  .grid-stack-item > .ui-resizable-nw { cursor: nw-resize; }
  .grid-stack-item > .ui-resizable-se { cursor: se-resize; bottom: 0; right: 0; transition: background 0.15s ease; }
  .grid-stack-item > .ui-resizable-sw { cursor: sw-resize; }

  .grid-stack-item:hover > .ui-resizable-se {
    background: linear-gradient(135deg, transparent 50%, rgba(123, 140, 255, 0.3) 50%);
  }
  .grid-stack-item:hover > .ui-resizable-e {
    background: linear-gradient(to right, transparent 40%, rgba(123, 140, 255, 0.1));
  }
  .grid-stack-item:hover > .ui-resizable-s {
    background: linear-gradient(to bottom, transparent 40%, rgba(123, 140, 255, 0.1));
  }
  body.locked .grid-stack-item > .ui-resizable-handle { display: none !important; }

  /* ===== PANEL HEADER ===== */
  .panel-header {
    height: var(--header-h);
    background: var(--panel-2);
    border-bottom: 1px solid var(--border-sub);
    display: flex;
    align-items: center;
    padding: 0 6px 0 0;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-dim);
    flex-shrink: 0;
    cursor: move;
    user-select: none;
    transition: background 0.1s ease, color 0.1s ease;
  }

  body:not(.locked) .panel-header:hover {
    background: var(--panel-hover);
    color: var(--text);
  }

  body.locked .panel-header { cursor: default; }

  /* Colored left stripe — identifies panel type at a glance */
  .panel-header .type-stripe {
    width: 3px;
    height: 100%;
    flex-shrink: 0;
    margin-right: 9px;
    background: var(--accent);
    opacity: 0.8;
    transition: opacity 0.1s ease;
  }

  .panel-header .title-group {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow: hidden;
    flex: 1;
  }

  .panel-header .title-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Actions are hidden until header hover — keeps the header a clean drag zone */
  .panel-header .actions {
    display: flex;
    gap: 1px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.12s ease;
  }

  .panel-header:hover .actions { opacity: 1; }

  .panel-header button {
    background: transparent;
    border: 0;
    color: var(--text-muted);
    cursor: pointer;
    padding: 3px 7px;
    font-size: 12px;
    border-radius: 3px;
    transition: color 0.1s ease, background 0.1s ease;
    font-family: inherit;
    line-height: 1;
    min-width: 24px;
    text-align: center;
  }

  .panel-header button:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.07);
  }

  .panel-header button.close-btn:hover {
    color: var(--danger);
    background: var(--danger-dim);
  }

  /* Panel type stripe colors */
  .panel-type-chat            .type-stripe { background: #9b6cff; }
  .panel-type-activity-feed   .type-stripe { background: #3ecf6e; }
  .panel-type-stream          .type-stripe { background: #ff5264; }
  .panel-type-quick-actions   .type-stripe { background: #7b8cff; }
  .panel-type-tikfinity-chat  .type-stripe { background: #ff7eb3; }
  .panel-type-tikfinity-views .type-stripe { background: #ff7eb3; }
  .panel-type-predictions     .type-stripe { background: #fbbf24; }
  .panel-type-sub-goal        .type-stripe { background: #3ecf6e; }
  .panel-type-stream-manager  .type-stripe { background: #7b8cff; }

  /* Locked state — stripe turns amber across all panels */
  body.locked .panel-header .type-stripe {
    background: #f0a000 !important;
    opacity: 1;
  }

  /* ===== PANEL BODY ===== */
  .panel-body {
    flex: 1 1 0;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .panel-body iframe {
    flex: 1 1 0;
    min-height: 0;
    width: 100%;
    border: 0;
    display: block;
  }

  /* ===== DRAG BEHAVIOR ===== */
  body.dragging iframe { pointer-events: none !important; }
  body.dragging * { user-select: none !important; }

  .grid-stack-item.ui-draggable-dragging,
  .grid-stack-item.ui-resizable-resizing {
    opacity: 0.85;
    z-index: 1000;
  }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    backdrop-filter: blur(6px);
  }

  .modal-overlay.show { display: flex; }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.97) translateY(-8px); }
    to   { opacity: 1; transform: scale(1)    translateY(0); }
  }
  .modal-overlay.show .modal { animation: modalIn 0.15s ease; }

  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 480px;
    max-width: 90vw;
    max-height: 85vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255,255,255,0.04);
  }

  .modal-header {
    padding: 14px 16px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-close-btn {
    background: transparent;
    border: 0;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 4px;
    line-height: 1;
    font-family: inherit;
    transition: color 0.1s ease, background 0.1s ease;
  }
  .modal-close-btn:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.07);
  }

  .modal-body {
    padding: 16px;
    overflow-y: auto;
    flex: 1;
  }

  .modal-body label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-muted);
    margin-bottom: 6px;
    margin-top: 18px;
    font-weight: 600;
  }
  .modal-body label:first-of-type { margin-top: 0; }

  .modal-body input[type="text"],
  .modal-body input[type="number"],
  .modal-body select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 5px;
    font-family: inherit;
    font-size: 12px;
    transition: border-color 0.1s ease, box-shadow 0.1s ease;
  }

  .modal-body input:focus,
  .modal-body select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  .modal-body input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  .range-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .range-row input[type="range"] { flex: 1; }
  .range-row .range-value {
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    min-width: 40px;
    text-align: right;
    font-size: 12px;
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    cursor: pointer;
  }
  .checkbox-row input[type="checkbox"] {
    accent-color: var(--accent);
    cursor: pointer;
    width: 14px;
    height: 14px;
  }
  .checkbox-row label {
    margin: 0;
    cursor: pointer;
    text-transform: none;
    letter-spacing: 0;
    color: var(--text);
    font-size: 12px;
  }

  /* ===== PRESET CARDS ===== */
  .preset-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 8px;
  }

  .preset-card {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 12px 8px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
    text-align: center;
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .preset-card:hover {
    border-color: var(--accent);
    background: var(--accent-dim);
    color: var(--text);
  }
  .preset-card .preset-icon { font-size: 20px; line-height: 1; }
  .preset-card .preset-name { font-size: 11px; font-weight: 600; color: var(--text); }
  .preset-card .preset-desc { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; }

  /* ===== MODAL FOOTER ===== */
  .modal-footer {
    padding: 12px 16px;
    background: var(--panel-2);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 6px;
  }

  .modal-footer button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 7px 16px;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    transition: color 0.1s ease, border-color 0.1s ease, background 0.1s ease;
  }
  .modal-footer button:hover {
    color: var(--text);
    border-color: #3a3a4a;
    background: rgba(255, 255, 255, 0.04);
  }
  .modal-footer button.primary {
    background: var(--accent);
    color: #0c0c0f;
    border-color: var(--accent);
    font-weight: 600;
  }
  .modal-footer button.primary:hover { opacity: 0.88; }

  /* ===== MODAL SECTIONS ===== */
  .modal-body hr {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 20px 0 4px;
  }

  .modal-body .section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    font-weight: 700;
    margin-top: 8px;
    margin-bottom: 12px;
  }

  /* ===== SETTINGS RESET BUTTON ===== */
  .preset-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 11px;
    font-family: inherit;
    text-align: center;
    width: 100%;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .preset-btn:hover { border-color: var(--accent); color: var(--text); }

  /* ===== FOCUS RINGS ===== */
  button:focus-visible,
  input:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a3a4a; }

  /* ===== UPDATE PROGRESS BAR ===== */
  .update-progress {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 8px;
  }
  .update-progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s ease;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
</style>
</head>
<body>

<!-- GRID -->
<div class="grid-wrapper" id="grid-wrapper">
  <div class="grid-stack" id="grid"></div>
</div>

<!-- ADD PANEL MODAL -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <div class="modal-header">
      <span>Add Panel</span>
      <button class="modal-close-btn" onclick="closeAddModal()">&#10005;</button>
    </div>
    <div class="modal-body">
      <label>Quick Presets</label>
      <div class="preset-grid">
        <button class="preset-card" onclick="addPresetPanel('chat')">
          <span class="preset-icon">💬</span>
          <span class="preset-name">Chat</span>
          <span class="preset-desc">Twitch + 7TV</span>
        </button>
        <button class="preset-card" onclick="addPresetPanel('stream')">
          <span class="preset-icon">📺</span>
          <span class="preset-name">Live Preview</span>
          <span class="preset-desc">Twitch Player</span>
        </button>
        <button class="preset-card" onclick="addPresetPanel('activity-feed')">
          <span class="preset-icon">📊</span>
          <span class="preset-name">Activity Feed</span>
          <span class="preset-desc">StreamElements</span>
        </button>
        <button class="preset-card" onclick="addPresetPanel('quick-actions')">
          <span class="preset-icon">⚡</span>
          <span class="preset-name">Quick Actions</span>
          <span class="preset-desc">Twitch Dashboard</span>
        </button>
        <button class="preset-card" onclick="addPresetPanel('predictions')">
          <span class="preset-icon">🎯</span>
          <span class="preset-name">Predictions</span>
          <span class="preset-desc">Twitch</span>
        </button>
        <button class="preset-card" onclick="addPresetPanel('stream-manager')">
          <span class="preset-icon">📻</span>
          <span class="preset-name">Stream Manager</span>
          <span class="preset-desc">Twitch Dashboard</span>
        </button>
        <button class="preset-card" onclick="addPresetPanel('tikfinity-chat')">
          <span class="preset-icon">🎵</span>
          <span class="preset-name">TikTok Chat</span>
          <span class="preset-desc">TikFinity</span>
        </button>
        <button class="preset-card" onclick="addPresetPanel('tikfinity-views')">
          <span class="preset-icon">👁</span>
          <span class="preset-name">TikTok Views</span>
          <span class="preset-desc">TikFinity</span>
        </button>
        <button class="preset-card" onclick="addPresetPanel('sub-goal')">
          <span class="preset-icon">🎁</span>
          <span class="preset-name">Sub Goal</span>
          <span class="preset-desc">StreamElements</span>
        </button>
      </div>

      <hr>
      <div class="section-title">Custom URL Panel</div>
      <label>Panel Name</label>
      <input type="text" id="custom-name" placeholder="e.g. My Custom Widget">
      <label>URL</label>
      <input type="text" id="custom-url" placeholder="https://...">
    </div>
    <div class="modal-footer">
      <button onclick="closeAddModal()">Cancel</button>
      <button class="primary" onclick="addCustomPanel()">Add Custom</button>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <div class="modal-header">
      <span>Settings</span>
      <button class="modal-close-btn" onclick="cancelSettings()">&#10005;</button>
    </div>
    <div class="modal-body">

      <div class="section-title">Layout</div>

      <label>Grid Columns (more = finer horizontal snap)</label>
      <div class="range-row">
        <input type="range" id="setting-columns" min="12" max="240" step="6">
        <span class="range-value" id="setting-columns-val">12</span>
      </div>

      <label>Grid Rows (more = finer vertical snap)</label>
      <div class="range-row">
        <input type="range" id="setting-rows" min="6" max="240" step="2">
        <span class="range-value" id="setting-rows-val">12</span>
      </div>

      <label>Panel Gap (pixels)</label>
      <div class="range-row">
        <input type="range" id="setting-gap" min="0" max="12" step="1">
        <span class="range-value" id="setting-gap-val">0</span>
      </div>

      <hr>
      <div class="section-title">Behavior</div>

      <div class="checkbox-row">
        <input type="checkbox" id="setting-float">
        <label for="setting-float">Float mode — panels can overlap, won't auto-stack</label>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="setting-animate">
        <label for="setting-animate">Animate panel movements</label>
      </div>

      <hr>
      <div class="section-title">Reset</div>
      <button class="preset-btn" onclick="resetSettings()">Reset settings to defaults</button>

    </div>
    <div class="modal-footer">
      <button onclick="cancelSettings()">Cancel</button>
      <button class="primary" onclick="closeSettings()">Done</button>
    </div>
  </div>
</div>

<!-- UPDATE STATUS MODAL -->
<div class="modal-overlay" id="update-modal">
  <div class="modal" style="width:420px;">
    <div class="modal-header">
      <span id="update-modal-title">Updates</span>
      <button class="modal-close-btn" onclick="closeUpdateModal()">&#10005;</button>
    </div>
    <div class="modal-body" id="update-modal-body" style="padding:28px 20px;text-align:center;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;">
    </div>
    <div class="modal-footer" id="update-modal-footer" style="justify-content:center;"></div>
  </div>
</div>

<!-- SAVE LAYOUT MODAL -->
<div class="modal-overlay" id="save-layout-modal">
  <div class="modal" style="width:400px;">
    <div class="modal-header">
      <span>Save Layout</span>
      <button class="modal-close-btn" onclick="closeSaveLayoutModal()">&#10005;</button>
    </div>
    <div class="modal-body">
      <label>Layout Name</label>
      <input type="text" id="save-layout-name" placeholder="e.g. Stream Setup, Gaming View…"
             onkeydown="if(event.key==='Enter') confirmSaveLayout()">
    </div>
    <div class="modal-footer">
      <button onclick="closeSaveLayoutModal()">Cancel</button>
      <button class="primary" onclick="confirmSaveLayout()">Save</button>
    </div>
  </div>
</div>

<!-- EDIT URL MODAL -->
<div class="modal-overlay" id="edit-url-modal">
  <div class="modal" style="width:520px;">
    <div class="modal-header">
      <span>Edit Panel URL</span>
      <button class="modal-close-btn" onclick="closeEditUrlModal()">&#10005;</button>
    </div>
    <div class="modal-body">
      <label>URL</label>
      <input type="text" id="edit-url-input" placeholder="https://…"
             onkeydown="if(event.key==='Enter') confirmEditUrl()">
    </div>
    <div class="modal-footer">
      <button onclick="closeEditUrlModal()">Cancel</button>
      <button class="primary" onclick="confirmEditUrl()">Update Panel</button>
    </div>
  </div>
</div>

<!-- GENERIC CONFIRM MODAL -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal" style="width:400px;">
    <div class="modal-header">
      <span id="confirm-modal-title">Confirm</span>
    </div>
    <div class="modal-body" id="confirm-modal-body" style="padding:20px 16px;"></div>
    <div class="modal-footer">
      <button onclick="resolveConfirm(false)">Cancel</button>
      <button class="primary" id="confirm-modal-ok" onclick="resolveConfirm(true)">OK</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js"></script>

<script>
  // ============ CONFIG ============
  const CHANNEL = 'aaroneal';

  const PRESETS = {
    'quick-actions': {
      title: 'Quick Actions',
      url: `https://dashboard.twitch.tv/popout/u/${CHANNEL}/stream-manager/quick-actions?uuid=f878d6215f2ff9c30de41b3cbdf4f7f6`,
      w: 4, h: 6
    },
    'activity-feed': {
      title: 'Activity Feed',
      url: `https://streamelements.com/dashboard/6214670f53678f6f0d07d53d/activity/popout`,
      w: 4, h: 6,
      type: 'webview'  // must be webview — iframe blocks SE auth cookies (third-party SameSite policy)
    },
    'chat': {
      title: 'Chat',
      url: `https://www.twitch.tv/popout/${CHANNEL}/chat?popout=`,
      w: 4, h: 12,
      type: 'webview'  // rendered as BrowserView so 7TV extension can inject
    },
    'stream': {
      title: 'Live Preview',
      url: `https://player.twitch.tv/?channel=${CHANNEL}&parent=localhost&muted=true&autoplay=true`,
      w: 8, h: 6,
      type: 'webview', // BrowserView — own renderer process, immune to main-window focus/blur
      stream: true     // signals buildPanelHTML to include the mute toggle button
    },
    'tikfinity-chat': {
      title: 'TikTok Chat',
      url: `https://tikfinity.zerody.one/widget/activity-feed?cid=30451&did=1`,
      w: 4, h: 6
    },
    'tikfinity-views': {
      title: 'TikTok Views',
      url: `https://tikfinity.zerody.one/widget/viewercount?cid=30451`,
      w: 2, h: 2
    },
    'predictions': {
      title: 'Predictions',
      url: `https://www.twitch.tv/popout/${CHANNEL}/predictions/summary`,
      w: 4, h: 6
    },
    'sub-goal': {
      title: 'Sub Goal',
      url: `https://streamelements.com/overlay/655ea9ee118dc33c8fadd6d2/editor?er=1`,
      w: 4, h: 3
    },
    'stream-manager': {
      title: 'Stream Manager',
      url: `https://dashboard.twitch.tv/u/${CHANNEL}/stream-manager`,
      w: 6, h: 9
    }
  };

  const DEFAULT_LAYOUT = [
    { id: 'p-quick-actions-default', preset: 'quick-actions', x: 0, y: 0,  w: 4, h: 6 },
    { id: 'p-activity-feed-default', preset: 'activity-feed', x: 4, y: 0,  w: 4, h: 6 },
    { id: 'p-chat-default',          preset: 'chat',          x: 8, y: 0,  w: 4, h: 12 },
    { id: 'p-stream-default',        preset: 'stream',        x: 0, y: 6,  w: 8, h: 6 }
  ];

  const DEFAULT_SETTINGS = {
    columns: 126,
    rows: 126,
    gap: 0,
    float: true,
    animate: false  // animations during drag cause visible lag; off by default
  };

  // ============ STATE ============
  let grid;
  let panels = {};
  let closedPanels = [];
  let isLocked = false;
  let settings = { ...DEFAULT_SETTINGS };

  // ============ SETTINGS ============
  function loadSettings() {
    const saved = localStorage.getItem('dashboard-settings');
    if (saved) {
      try { settings = { ...DEFAULT_SETTINGS, ...JSON.parse(saved) }; }
      catch { settings = { ...DEFAULT_SETTINGS }; }
    }
    applySettings();
  }

  function saveSettings() {
    localStorage.setItem('dashboard-settings', JSON.stringify(settings));
  }

  function applySettings() {
    document.documentElement.style.setProperty('--gap', settings.gap + 'px');

    if (grid) {
      grid.cellHeight(calculateCellHeight());
      grid.float(settings.float);
      grid.opts.animate = settings.animate;
      grid.margin(settings.gap);
    }
  }

  let pendingSettings = null;

  function openSettings() {
    pendingSettings = { ...settings };

    document.getElementById('setting-columns').value = settings.columns;
    document.getElementById('setting-columns-val').textContent = settings.columns;
    document.getElementById('setting-rows').value = settings.rows;
    document.getElementById('setting-rows-val').textContent = settings.rows;
    document.getElementById('setting-gap').value = settings.gap;
    document.getElementById('setting-gap-val').textContent = settings.gap;
    document.getElementById('setting-float').checked = settings.float;
    document.getElementById('setting-animate').checked = settings.animate;

    document.getElementById('settings-modal').classList.add('show');
    document.body.classList.add('modal-open');
  }

  function closeSettings() {
    if (!pendingSettings) {
      document.getElementById('settings-modal').classList.remove('show');
      document.body.classList.remove('modal-open');
      return;
    }

    const colsChanged = pendingSettings.columns !== settings.columns;
    const rowsChanged = pendingSettings.rows !== settings.rows;
    const needsReload = colsChanged || rowsChanged;

    saveLayout();
    if (colsChanged) scaleLayoutColumns(settings.columns, pendingSettings.columns);
    if (rowsChanged) scaleLayoutRows(settings.rows, pendingSettings.rows);

    settings = { ...pendingSettings };
    pendingSettings = null;
    saveSettings();

    document.getElementById('settings-modal').classList.remove('show');
    document.body.classList.remove('modal-open');

    if (needsReload) {
      window.electronAPI?.bvDestroyAll();
      location.reload();
    } else {
      applySettings();
    }
  }

  function cancelSettings() {
    pendingSettings = null;
    document.getElementById('settings-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
    applySettings();
  }

  function bindSettingsControls() {
    document.getElementById('setting-columns').addEventListener('input', e => {
      const v = parseInt(e.target.value);
      if (pendingSettings) pendingSettings.columns = v;
      document.getElementById('setting-columns-val').textContent = v;
    });

    document.getElementById('setting-rows').addEventListener('input', e => {
      const v = parseInt(e.target.value);
      if (pendingSettings) pendingSettings.rows = v;
      document.getElementById('setting-rows-val').textContent = v;
    });

    document.getElementById('setting-gap').addEventListener('input', e => {
      const v = parseInt(e.target.value);
      if (pendingSettings) pendingSettings.gap = v;
      document.getElementById('setting-gap-val').textContent = v;
      document.documentElement.style.setProperty('--gap', v + 'px');
      if (grid) {
        grid.margin(v);
        grid.cellHeight(calculateCellHeightForRows(settings.rows, v));
      }
    });

    document.getElementById('setting-float').addEventListener('change', e => {
      if (pendingSettings) pendingSettings.float = e.target.checked;
      if (grid) grid.float(e.target.checked);
    });

    document.getElementById('setting-animate').addEventListener('change', e => {
      if (pendingSettings) pendingSettings.animate = e.target.checked;
      if (grid) grid.opts.animate = e.target.checked;
    });
  }

  async function resetSettings() {
    const ok = await showConfirm('Reset Settings',
      'Reset all settings to defaults? Panel positions are kept.', 'Reset');
    if (!ok) return;
    settings = { ...DEFAULT_SETTINGS };
    saveSettings();
    window.electronAPI?.bvDestroyAll();
    location.reload();
  }

  function scaleLayoutColumns(oldCols, newCols) {
    const saved = localStorage.getItem('dashboard-layout');
    if (!saved) return;
    try {
      const nodes = JSON.parse(saved);
      const ratio = newCols / oldCols;
      const scaled = nodes.map(n => ({
        ...n,
        x: Math.round(n.x * ratio),
        w: Math.max(1, Math.round(n.w * ratio))
      }));
      scaled.forEach(n => {
        if (n.x + n.w > newCols) n.w = newCols - n.x;
        if (n.w < 1) { n.x = 0; n.w = Math.min(newCols, 4); }
      });
      localStorage.setItem('dashboard-layout', JSON.stringify(scaled));
    } catch (e) { console.warn('scaleLayoutColumns failed', e); }
  }

  function scaleLayoutRows(oldRows, newRows) {
    const saved = localStorage.getItem('dashboard-layout');
    if (!saved) return;
    try {
      const nodes = JSON.parse(saved);
      const ratio = newRows / oldRows;
      const scaled = nodes.map(n => ({
        ...n,
        y: Math.round(n.y * ratio),
        h: Math.max(1, Math.round(n.h * ratio))
      }));
      localStorage.setItem('dashboard-layout', JSON.stringify(scaled));
    } catch (e) { console.warn('scaleLayoutRows failed', e); }
  }

  // ============ INIT ============
  function calculateCellHeight() {
    return calculateCellHeightForRows(settings.rows, settings.gap);
  }

  function calculateCellHeightForRows(rows, gap) {
    const totalGap = gap * (rows + 1);
    const available = window.innerHeight - totalGap;
    return Math.max(8, available / rows);
  }

  function injectColumnCSS(columnCount) {
    const styleId = 'gridstack-custom-columns';
    let style = document.getElementById(styleId);
    if (!style) {
      style = document.createElement('style');
      style.id = styleId;
      document.head.appendChild(style);
    }

    let css = '';
    const pct = 100 / columnCount;
    for (let i = 0; i <= columnCount; i++) {
      css += `.grid-stack > .grid-stack-item[gs-w="${i}"] { width: ${pct * i}%; }\n`;
      css += `.grid-stack > .grid-stack-item[gs-x="${i}"] { left: ${pct * i}%; }\n`;
      css += `.grid-stack > .grid-stack-item[gs-min-w="${i}"] { min-width: ${pct * i}%; }\n`;
      css += `.grid-stack > .grid-stack-item[gs-max-w="${i}"] { max-width: ${pct * i}%; }\n`;
    }
    style.textContent = css;
  }

  function initGrid() {
    injectColumnCSS(settings.columns);

    grid = GridStack.init({
      column: settings.columns,
      cellHeight: calculateCellHeight(),
      margin: settings.gap,
      float: settings.float,
      animate: settings.animate,
      maxRow: settings.rows,
      resizable: { handles: 'all' },
      draggable: { handle: '.panel-header' },
      disableOneColumnMode: true
    });

    grid.on('dragstart', () => {
      document.body.classList.add('dragging');
      bvHide();
    });
    grid.on('dragstop', (e, el) => {
      document.body.classList.remove('dragging');
      autoFillPanel(el?.gridstackNode, el);
      bvShow();
      saveLayout();
    });

    setupResizeHandlers();
    setupEdgeDoubleClick();

    grid.on('change',        () => { saveLayout(); syncAllBVBounds(); });
    grid.on('added removed', () => { saveLayout(); syncAllBVBounds(); });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (grid) grid.cellHeight(calculateCellHeight());
        syncAllBVBounds();
      }, 150);
    });
  }

  // ============ RESIZE EVENTS ============
  function setupResizeHandlers() {
    grid.on('resizestart', () => {
      document.body.classList.add('dragging');
      bvHide();
    });
    grid.on('resizestop', (e, el) => {
      document.body.classList.remove('dragging');
      tileAdjacentPanels(el?.gridstackNode);
      bvShow();
      saveLayout();
    });
  }

  function tileAdjacentPanels(node) {
    if (!node || !grid) return;
    let changed = false;

    const others = grid.engine.nodes.filter(n => n.id !== node.id && !n.locked);

    for (const o of others) {
      const xOverlap = node.x < o.x + o.w && node.x + node.w > o.x;
      const yOverlap = node.y < o.y + o.h && node.y + node.h > o.y;
      if (!xOverlap || !yOverlap) continue;

      const options = [];

      if (node.x > o.x) {
        const newW = node.x - o.x;
        if (newW >= 1) options.push({ cost: o.w - newW, update: { w: newW } });
      }
      if (node.x + node.w < o.x + o.w) {
        const newX = node.x + node.w;
        const newW = (o.x + o.w) - newX;
        if (newW >= 1) options.push({ cost: o.w - newW, update: { x: newX, w: newW } });
      }
      if (node.y > o.y) {
        const newH = node.y - o.y;
        if (newH >= 1) options.push({ cost: o.h - newH, update: { h: newH } });
      }
      if (node.y + node.h < o.y + o.h) {
        const newY = node.y + node.h;
        const newH = (o.y + o.h) - newY;
        if (newH >= 1) options.push({ cost: o.h - newH, update: { y: newY, h: newH } });
      }

      if (options.length === 0) continue;

      options.sort((a, b) => a.cost - b.cost);
      grid.update(o.el, options[0].update);
      changed = true;
    }

    if (changed) {
      syncAllBVBounds();
      saveLayout();
    }
  }

  function setupEdgeDoubleClick() {
    document.getElementById('grid').addEventListener('dblclick', e => {
      const handle = e.target.closest('.ui-resizable-handle');
      if (!handle) return;
      const item = handle.closest('.grid-stack-item');
      if (!item) return;
      e.preventDefault();
      e.stopPropagation();
      const node = item.gridstackNode;
      if (!node) return;

      const toRight  = handle.classList.contains('ui-resizable-e')  ||
                       handle.classList.contains('ui-resizable-ne') ||
                       handle.classList.contains('ui-resizable-se');
      const toBottom = handle.classList.contains('ui-resizable-s')  ||
                       handle.classList.contains('ui-resizable-se') ||
                       handle.classList.contains('ui-resizable-sw');
      const toLeft   = handle.classList.contains('ui-resizable-w')  ||
                       handle.classList.contains('ui-resizable-nw') ||
                       handle.classList.contains('ui-resizable-sw');
      const toTop    = handle.classList.contains('ui-resizable-n')  ||
                       handle.classList.contains('ui-resizable-ne') ||
                       handle.classList.contains('ui-resizable-nw');

      const cols    = grid.opts.column;
      const maxRows = settings.rows;
      const others  = grid.engine.nodes.filter(n => n.id !== node.id);

      const nearestRight = () => {
        const hit = others.filter(n =>
          n.x >= node.x + node.w &&
          n.y < node.y + node.h && n.y + n.h > node.y
        ).sort((a, b) => a.x - b.x)[0];
        return hit ? hit.x - node.x : cols - node.x;
      };
      const nearestBottom = () => {
        const hit = others.filter(n =>
          n.y >= node.y + node.h &&
          n.x < node.x + node.w && n.x + n.w > node.x
        ).sort((a, b) => a.y - b.y)[0];
        return hit ? hit.y - node.y : maxRows - node.y;
      };
      const nearestLeft = () => {
        const hit = others.filter(n =>
          n.x + n.w <= node.x &&
          n.y < node.y + node.h && n.y + n.h > node.y
        ).sort((a, b) => b.x - a.x)[0];
        return hit ? hit.x + hit.w : 0;
      };
      const nearestTop = () => {
        const hit = others.filter(n =>
          n.y + n.h <= node.y &&
          n.x < node.x + node.w && n.x + n.w > node.x
        ).sort((a, b) => b.y - a.y)[0];
        return hit ? hit.y + hit.h : 0;
      };

      const updates = {};
      if (toRight)  updates.w = nearestRight();
      if (toBottom) updates.h = nearestBottom();
      if (toLeft)  { const nx = nearestLeft(); updates.x = nx; updates.w = node.x + node.w - nx; }
      if (toTop)   { const ny = nearestTop();  updates.y = ny; updates.h = node.y + node.h - ny; }

      if (Object.keys(updates).length > 0) {
        grid.update(item, updates);
        syncAllBVBounds();
        saveLayout();
      }
    });
  }

  function autoFillPanel(node, el) {
    if (!node || !el) return;
    const cols    = grid.opts.column;
    const maxRows = settings.rows;
    const others  = grid.engine.nodes.filter(n => n.id !== node.id);

    const cellOccupied = (col, row) =>
      others.some(n => n.x <= col && col < n.x + n.w && n.y <= row && row < n.y + n.h);

    let newW = node.w;
    for (let col = node.x + node.w; col < cols; col++) {
      const blocked = Array.from({ length: node.h }, (_, i) => node.y + i)
                           .some(row => cellOccupied(col, row));
      if (blocked) break;
      newW++;
    }

    let newH = node.h;
    for (let row = node.y + node.h; row < maxRows; row++) {
      const blocked = Array.from({ length: newW }, (_, i) => node.x + i)
                           .some(col => cellOccupied(col, row));
      if (blocked) break;
      newH++;
    }

    if (newW !== node.w || newH !== node.h) {
      grid.update(el, { w: newW, h: newH });
    }
  }

  // ── BrowserView panel management ─────────────────────────────────────────────
  let _bvHideCount = 0;

  function bvHide() {
    if (_bvHideCount++ === 0) window.electronAPI?.bvSetVisible(false);
  }
  function bvShow() {
    _bvHideCount = Math.max(0, _bvHideCount - 1);
    if (_bvHideCount === 0) {
      syncAllBVBounds();
      window.electronAPI?.bvSetVisible(true);
    }
  }

  function getBVBounds(id) {
    const body = document.querySelector(`#content-${id} .panel-body`);
    if (!body) return null;
    const r = body.getBoundingClientRect();
    if (r.width <= 0 || r.height <= 0) return null;
    return { x: Math.round(r.left), y: Math.round(r.top),
             w: Math.round(r.width), h: Math.round(r.height) };
  }

  function isBVPanel(cfg) { return cfg.type === 'webview' || cfg.type === 'stream'; }

  function syncAllBVBounds() {
    if (!window.electronAPI) return;
    const updates = [];
    for (const [id, cfg] of Object.entries(panels)) {
      if (!isBVPanel(cfg)) continue;
      const bounds = getBVBounds(id);
      if (bounds) updates.push({ id, bounds });
    }
    if (updates.length) window.electronAPI.bvSetAllBounds(updates);
  }

  function createBVPanel(id) {
    const cfg = panels[id];
    if (!cfg || !isBVPanel(cfg)) return;
    let attempts = 0;
    const tryCreate = () => {
      const bounds = getBVBounds(id);
      if (bounds) {
        window.electronAPI?.bvCreate({ id, url: cfg.url, bounds });
        requestAnimationFrame(syncAllBVBounds);
      } else if (++attempts < 20) {
        requestAnimationFrame(tryCreate);
      } else {
        const item = document.querySelector(`#content-${id}`)?.closest('.grid-stack-item');
        const body = document.querySelector(`#content-${id} .panel-body`);
        if (body && item) {
          const r = body.getBoundingClientRect();
          const h = Math.max(1, parseFloat(item.style.height || '0') - 28 - 2);
          window.electronAPI?.bvCreate({
            id, url: cfg.url,
            bounds: { x: Math.round(r.left), y: Math.round(r.top),
                      w: Math.max(1, Math.round(r.width)), h }
          });
        }
      }
    };
    requestAnimationFrame(tryCreate);
  }

  function destroyBVPanel(id) {
    window.electronAPI?.bvDestroy({ id });
  }

  let _modalWasOpen = false;
  new MutationObserver(() => {
    const open = document.body.classList.contains('modal-open');
    if (open && !_modalWasOpen)  { _modalWasOpen = true;  bvHide(); }
    if (!open && _modalWasOpen)  { _modalWasOpen = false; bvShow(); }
  }).observe(document.body, { attributes: true, attributeFilter: ['class'] });

  document.getElementById('grid-wrapper').addEventListener('scroll', () => {
    if (_bvHideCount === 0) syncAllBVBounds();
  });

  // ============ PANEL HTML ============
  function buildPanelHTML(id, config) {
    const { title, url, type } = config;

    if (type === 'webview' || type === 'stream') {
      let muteBtn = '';
      if (config.stream) {
        let isMuted = true;
        try { isMuted = new URL(config.url).searchParams.get('muted') !== 'false'; } catch {}
        muteBtn = `<button onclick="toggleStreamMute('${id}')" title="Toggle mute"><span class="mute-icon">${isMuted ? '&#128263;' : '&#128266;'}</span></button>`;
      }
      return `
        <div class="panel-header">
          <div class="type-stripe"></div>
          <div class="title-group">
            <span class="title-text">${escapeHtml(title)}</span>
          </div>
          <div class="actions">
            ${muteBtn}
            <button onclick="editPanelUrl('${id}')" title="Edit URL">&#9998;</button>
            <button onclick="reloadPanel('${id}')" title="Reload">&#8635;</button>
            <button class="close-btn" onclick="closePanel('${id}')" title="Close">&#10005;</button>
          </div>
        </div>
        <div class="panel-body"></div>
      `;
    }

    return `
      <div class="panel-header">
        <div class="type-stripe"></div>
        <div class="title-group">
          <span class="title-text">${escapeHtml(title)}</span>
        </div>
        <div class="actions">
          <button onclick="editPanelUrl('${id}')" title="Edit URL">&#9998;</button>
          <button onclick="reloadPanel('${id}')" title="Reload">&#8635;</button>
          <button class="close-btn" onclick="closePanel('${id}')" title="Close">&#10005;</button>
        </div>
      </div>
      <div class="panel-body">
        <iframe src="${escapeHtml(url)}" allow="clipboard-read; clipboard-write"></iframe>
      </div>
    `;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ============ CRUD ============
  function addPanel(id, config, gridOpts = {}) {
    const w = gridOpts.w || config.w || 8;
    const h = gridOpts.h || config.h || 12;
    const x = gridOpts.x;
    const y = gridOpts.y;

    const typeClass = `panel-type-${config.preset || 'custom'}`;

    const widget = {
      id,
      w, h,
      ...(x !== undefined ? { x } : {}),
      ...(y !== undefined ? { y } : {}),
      content: `<div class="grid-stack-item-content ${typeClass}" id="content-${id}">${buildPanelHTML(id, config)}</div>`
    };

    grid.addWidget(widget);
    panels[id] = config;
    if (isBVPanel(config)) createBVPanel(id);
    saveLayout();
  }

  function closePanel(id) {
    const config = panels[id];
    if (!config) return;
    const node = grid.engine.nodes.find(n => n.id === id);
    if (!node) return;

    if (isBVPanel(config)) destroyBVPanel(id);
    closedPanels.push({ ...config, w: node.w, h: node.h });
    grid.removeWidget(node.el, true);
    delete panels[id];
    saveLayout();
    saveClosedPanels();
    notifyMenuUpdate();
  }

  function reopenPanel(idx) {
    const config = closedPanels.splice(idx, 1)[0];
    if (!config) return;
    const newId = `p-${config.preset || 'custom'}-${Date.now()}`;
    addPanel(newId, config, { w: config.w, h: config.h });
    saveClosedPanels();
    notifyMenuUpdate();
  }

  // ============ DIALOGS ============
  function addPanelDialog() {
    document.getElementById('add-modal').classList.add('show');
    document.body.classList.add('modal-open');
  }
  function closeAddModal() {
    document.getElementById('add-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
    document.getElementById('custom-name').value = '';
    document.getElementById('custom-url').value = '';
  }
  function addPresetPanel(presetKey) {
    const preset = PRESETS[presetKey];
    if (!preset) return;
    const id = `p-${presetKey}-${Date.now()}`;
    addPanel(id, { ...preset, preset: presetKey });
    closeAddModal();
  }
  async function addCustomPanel() {
    const name = document.getElementById('custom-name').value.trim();
    const url = document.getElementById('custom-url').value.trim();
    if (!name || !url) {
      await showConfirm('Missing Fields', 'Please provide both a name and a URL.', 'OK');
      return;
    }
    const id = `p-custom-${Date.now()}`;
    addPanel(id, { title: name, url, w: 8, h: 12 });
    closeAddModal();
  }

  // ============ SAVED LAYOUTS ============
  function getSavedLayouts() {
    try { return JSON.parse(localStorage.getItem('dashboard-saved-layouts') || '[]'); }
    catch { return []; }
  }
  function setSavedLayouts(layouts) {
    localStorage.setItem('dashboard-saved-layouts', JSON.stringify(layouts));
  }
  function captureCurrentLayout() {
    if (!grid) return null;
    const nodes = grid.engine.nodes.map(n => ({
      id: n.id, x: n.x, y: n.y, w: n.w, h: n.h, config: panels[n.id]
    })).filter(n => n.config);
    return { panels: nodes, columns: settings.columns, rows: settings.rows, gap: settings.gap, savedAt: Date.now() };
  }
  function saveCurrentAsLayout() {
    document.getElementById('save-layout-name').value = '';
    document.getElementById('save-layout-modal').classList.add('show');
    document.body.classList.add('modal-open');
    setTimeout(() => document.getElementById('save-layout-name').focus(), 50);
  }
  function closeSaveLayoutModal() {
    document.getElementById('save-layout-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
  }
  async function confirmSaveLayout() {
    const name = document.getElementById('save-layout-name').value.trim();
    if (!name) return;
    closeSaveLayoutModal();
    const layouts = getSavedLayouts();
    const existingIdx = layouts.findIndex(l => l.name === name);
    if (existingIdx >= 0) {
      const ok = await showConfirm('Overwrite Layout',
        `A layout named "${name}" already exists. Overwrite it?`, 'Overwrite');
      if (!ok) return;
      layouts.splice(existingIdx, 1);
    }
    const captured = captureCurrentLayout();
    if (!captured) return;
    layouts.push({ name, ...captured });
    setSavedLayouts(layouts);
    notifyMenuUpdate();
  }
  async function loadSavedLayout(idx) {
    const layouts = getSavedLayouts();
    const layout = layouts[idx];
    if (!layout) return;
    const ok = await showConfirm('Load Layout',
      `Load "${layout.name}"? Your current panel positions will be replaced.`, 'Load');
    if (!ok) return;
    const newSettings = { ...settings, columns: layout.columns, rows: layout.rows,
      gap: layout.gap !== undefined ? layout.gap : settings.gap };
    localStorage.setItem('dashboard-settings', JSON.stringify(newSettings));
    localStorage.setItem('dashboard-layout', JSON.stringify(layout.panels));
    localStorage.setItem('dashboard-version', String(LAYOUT_VERSION));
    window.electronAPI?.bvDestroyAll();
    location.reload();
  }
  async function deleteSavedLayout(idx, event) {
    if (event) event.stopPropagation();
    const layouts = getSavedLayouts();
    const layout = layouts[idx];
    if (!layout) return;
    const ok = await showConfirm('Delete Layout', `Delete "${layout.name}"?`, 'Delete');
    if (!ok) return;
    layouts.splice(idx, 1);
    setSavedLayouts(layouts);
    notifyMenuUpdate();
  }

  // ============ PANEL ACTIONS ============
  function reloadPanel(id) {
    if (isBVPanel(panels[id])) {
      window.electronAPI?.bvReload({ id });
      return;
    }
    const content = document.getElementById(`content-${id}`);
    if (!content) return;
    content.querySelectorAll('iframe').forEach(f => { f.src = f.src; });
  }

  function toggleStreamMute(id) {
    const cfg = panels[id];
    if (!cfg || !cfg.stream) return;
    const url = new URL(cfg.url);
    const wasMuted = url.searchParams.get('muted') !== 'false';
    url.searchParams.set('muted', wasMuted ? 'false' : 'true');
    cfg.url = url.toString();
    window.electronAPI?.bvNavigate({ id, url: cfg.url });
    const icon = document.querySelector(`#content-${id} .mute-icon`);
    if (icon) icon.innerHTML = wasMuted ? '&#128266;' : '&#128263;';
    saveLayout();
  }

  let _editingPanelId = null;
  function editPanelUrl(id) {
    const config = panels[id];
    if (!config) return;
    _editingPanelId = id;
    document.getElementById('edit-url-input').value = config.url;
    document.getElementById('edit-url-modal').classList.add('show');
    document.body.classList.add('modal-open');
    setTimeout(() => {
      const inp = document.getElementById('edit-url-input');
      inp.focus(); inp.select();
    }, 50);
  }
  function closeEditUrlModal() {
    _editingPanelId = null;
    document.getElementById('edit-url-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
  }
  async function confirmEditUrl() {
    const raw = document.getElementById('edit-url-input').value.trim();
    if (!raw) return;
    try { new URL(raw); } catch {
      await showConfirm('Invalid URL', 'Please enter a valid URL starting with https://', 'OK');
      return;
    }
    closeEditUrlModal();
    const id = _editingPanelId;
    if (!id || !panels[id]) return;
    panels[id].url = raw;
    if (panels[id].type === 'webview') {
      window.electronAPI?.bvNavigate({ id, url: raw });
    } else {
      const content = document.getElementById(`content-${id}`);
      if (content) content.querySelectorAll('iframe').forEach(f => { f.src = raw; });
    }
    saveLayout();
  }

  function reloadAll() {
    Object.entries(panels).forEach(([id, cfg]) => {
      if (isBVPanel(cfg)) window.electronAPI?.bvReload({ id });
    });
    document.querySelectorAll('.grid-stack iframe').forEach(f => { f.src = f.src; });
  }

  function toggleLock() {
    isLocked = !isLocked;
    document.body.classList.toggle('locked', isLocked);
    grid.engine.nodes.forEach(node => {
      grid.update(node.el, { noMove: isLocked, noResize: isLocked, locked: isLocked });
    });
  }

  async function resetLayout() {
    const ok = await showConfirm('Reset Layout',
      'Reset to the default layout? Custom panels will be removed and positions cleared.', 'Reset');
    if (!ok) return;
    localStorage.removeItem('dashboard-layout');
    localStorage.removeItem('dashboard-closed');
    localStorage.removeItem('dashboard-version');
    const newSettings = { ...settings, columns: DEFAULT_SETTINGS.columns, rows: DEFAULT_SETTINGS.rows };
    localStorage.setItem('dashboard-settings', JSON.stringify(newSettings));
    window.electronAPI?.bvDestroyAll();
    location.reload();
  }

  // ============ PERSISTENCE ============
  const LAYOUT_VERSION = 2;

  function saveLayout() {
    if (!grid) return;
    const nodes = grid.engine.nodes.map(n => ({
      id: n.id, x: n.x, y: n.y, w: n.w, h: n.h, config: panels[n.id]
    })).filter(n => n.config);
    localStorage.setItem('dashboard-layout', JSON.stringify(nodes));
    localStorage.setItem('dashboard-version', String(LAYOUT_VERSION));
  }

  function saveClosedPanels() {
    localStorage.setItem('dashboard-closed', JSON.stringify(closedPanels));
  }

  function loadLayout() {
    const saved = localStorage.getItem('dashboard-layout');
    const closedSaved = localStorage.getItem('dashboard-closed');
    const savedVersion = parseInt(localStorage.getItem('dashboard-version') || '1');

    if (closedSaved) {
      try { closedPanels = JSON.parse(closedSaved) || []; } catch {}
    }

    if (saved && savedVersion === LAYOUT_VERSION) {
      try {
        const nodes = JSON.parse(saved);
        if (nodes.length > 0) {
          const usable = nodes.filter(n => n.config && n.w > 0 && n.h > 0).map(n => {
            const node = { ...n };
            if (node.x < 0) node.x = 0;
            if (node.y < 0) node.y = 0;
            if (node.x + node.w > settings.columns) {
              node.w = settings.columns - node.x;
              if (node.w < 1) { node.x = 0; node.w = Math.min(settings.columns, 4); }
            }
            if (node.config.preset && PRESETS[node.config.preset]) {
              const fresh = PRESETS[node.config.preset];
              node.config.url    = fresh.url;
              node.config.type   = fresh.type;
              node.config.stream = fresh.stream || false;
            }
            return node;
          });
          if (usable.length > 0) {
            usable.forEach(n => addPanel(n.id, n.config, { x: n.x, y: n.y, w: n.w, h: n.h }));
            return;
          }
        }
      } catch (e) { console.warn('Failed to load layout', e); }
    }

    localStorage.setItem('dashboard-version', String(LAYOUT_VERSION));
    const colRatio = settings.columns / 12;
    const rowRatio = settings.rows / 12;

    DEFAULT_LAYOUT.forEach(item => {
      const config = { ...PRESETS[item.preset], preset: item.preset };
      addPanel(item.id, config, {
        x: Math.round(item.x * colRatio),
        y: Math.round(item.y * rowRatio),
        w: Math.max(1, Math.round(item.w * colRatio)),
        h: Math.max(1, Math.round(item.h * rowRatio))
      });
    });
  }

  // ============ CONFIRM MODAL ============
  let _confirmResolve = null;
  function showConfirm(title, message, okLabel = 'OK') {
    return new Promise(resolve => {
      _confirmResolve = resolve;
      document.getElementById('confirm-modal-title').textContent = title;
      document.getElementById('confirm-modal-body').textContent = message;
      document.getElementById('confirm-modal-ok').textContent = okLabel;
      document.getElementById('confirm-modal').classList.add('show');
      document.body.classList.add('modal-open');
    });
  }
  function resolveConfirm(result) {
    document.getElementById('confirm-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
    if (_confirmResolve) { _confirmResolve(result); _confirmResolve = null; }
  }

  // ============ UPDATE MODAL ============
  function closeUpdateModal() {
    document.getElementById('update-modal').classList.remove('show');
    document.body.classList.remove('modal-open');
  }
  function showUpdateStatus(payload) {
    const modal  = document.getElementById('update-modal');
    const body   = document.getElementById('update-modal-body');
    const footer = document.getElementById('update-modal-footer');
    const title  = document.getElementById('update-modal-title');

    modal.classList.add('show');
    document.body.classList.add('modal-open');
    footer.innerHTML = '';

    switch (payload.state) {
      case 'checking':
        title.textContent = 'Checking for Updates';
        body.innerHTML = '<span style="color:var(--text-dim)">Checking GitHub releases…</span>';
        break;
      case 'available':
        title.textContent = 'Update Available';
        body.innerHTML = `<span>Version <strong style="color:var(--accent)">${payload.version}</strong> is available.</span>
          <span style="color:var(--text-dim);font-size:11px;">The update will download automatically in the background.</span>`;
        break;
      case 'not-available':
        title.textContent = 'Up to Date';
        body.innerHTML = `<span>You're running the latest version.</span>
          <span style="color:var(--text-dim);font-size:11px;">(${payload.version})</span>`;
        footer.innerHTML = `
          <button onclick="window.electronAPI?.checkForUpdates()">Check Again</button>
          <button class="primary" onclick="closeUpdateModal()">Close</button>`;
        break;
      case 'downloading': {
        const pct = payload.percent || 0;
        title.textContent = 'Downloading Update';
        body.innerHTML = `
          <span>Downloading… ${pct}%</span>
          <div class="update-progress">
            <div class="update-progress-fill" style="width:${pct}%"></div>
          </div>`;
        break;
      }
      case 'ready':
        title.textContent = 'Ready to Install';
        body.innerHTML = `<span>Version <strong style="color:var(--accent)">${payload.version}</strong> has been downloaded.</span>
          <span style="color:var(--text-dim);font-size:11px;">The app will restart to apply the update.</span>`;
        footer.innerHTML = `
          <button onclick="closeUpdateModal()">Later</button>
          <button class="primary" onclick="window.electronAPI.installUpdate()">Restart &amp; Install</button>`;
        break;
      case 'error':
        title.textContent = 'Update Error';
        body.innerHTML = `<span style="color:var(--danger)">Update check failed.</span>
          <span style="color:var(--text-dim);font-size:11px;word-break:break-all;">${payload.message || 'Unknown error'}</span>`;
        footer.innerHTML = `
          <button onclick="window.electronAPI?.checkForUpdates()">Try Again</button>
          <button class="primary" onclick="closeUpdateModal()">Close</button>`;
        break;
    }
  }

  // ============ NATIVE MENU SYNC ============
  function notifyMenuUpdate() {
    if (!window.electronAPI) return;
    const layouts = getSavedLayouts().map((l, i) => ({ name: l.name, index: i }));
    const closedData = closedPanels.map((p, i) => ({ title: p.title, index: i }));
    window.electronAPI.updateMenu({ layouts, closedPanels: closedData });
  }

  // ============ SHORTCUTS ============
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.shiftKey && (e.key === 'R' || e.key === 'r')) { e.preventDefault(); reloadAll(); }
    if (e.ctrlKey && e.key === 'l') { e.preventDefault(); toggleLock(); }
    if (e.ctrlKey && e.key === ',') { e.preventDefault(); openSettings(); }
    if (e.key === 'Escape') {
      closeAddModal(); cancelSettings(); closeEditUrlModal();
      closeSaveLayoutModal(); closeUpdateModal();
      resolveConfirm(false);
    }
  });

  // ============ STARTUP ============
  loadSettings();
  initGrid();
  bindSettingsControls();
  loadLayout();
  applySettings();
  notifyMenuUpdate();

  if (window.electronAPI) {
    window.electronAPI.onUpdateStatus(showUpdateStatus);
    // Sync any update state that arrived before this listener registered
    window.electronAPI.getUpdateStatus().then(payload => {
      if (payload) showUpdateStatus(payload);
    }).catch(() => {});
  }
</script>

</body>
